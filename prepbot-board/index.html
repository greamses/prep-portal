<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- seo:head -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- /seo:head -->
    <title>PrepBot Board | Prep Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Page access gate: feature "whiteboard" (off = admin-granted testers only) -->
    <script type="module" src="/utils/auth/premium-guard.js"></script>
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;600;700&family=Shantell+Sans:wght@500;600;700&family=Playwrite+US+Trad:wght@100..400&display=swap" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
        }
      }
    </script>
    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="/prepbot-board/css/board.css" />
  </head>
  <body>
    <div class="pb-paint" aria-hidden="true"></div>

    <main class="pb-stage">
      <!-- the board IS the screen -->
      <div class="pb-boardwrap" id="pb-boardwrap">
        <svg id="pb-board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PrepBot's whiteboard. Tap it to cut in."></svg>
        <p class="pb-visually-hidden" id="pb-caption" aria-live="polite"></p>
      </div>

      <!-- the left rail: where you are, how PrepBot teaches, the hand it writes in, a new board -->
      <nav class="pb-rail" aria-label="Board">
        <a class="pb-ico" href="/" id="pb-back" data-tip="Back to Prep Portal" data-tip-side="right" aria-label="Back to Prep Portal" data-ico="back"></a>
        <div class="pb-rail__group" role="radiogroup" aria-label="How PrepBot teaches">
          <button type="button" class="pb-ico pb-style__btn" data-style="check" role="radio" aria-checked="true" data-tip="Checks in: PrepBot stops to ask you questions" data-tip-side="right" aria-label="Checks in" data-ico="checkin"></button>
          <button type="button" class="pb-ico pb-style__btn" data-style="lecture" role="radio" aria-checked="false" data-tip="Lecture: PrepBot teaches straight through; raise your hand to ask" data-tip-side="right" aria-label="Lecture" data-ico="lecture"></button>
          <button type="button" class="pb-ico pb-style__btn" data-style="homework" role="radio" aria-checked="false" data-tip="Homework: you solve it step by step, with hints" data-tip-side="right" aria-label="Homework" data-ico="homework"></button>
        </div>
        <!-- the site's own dropdown (pp-select.js) over a real <select>; its trigger dressed as an icon -->
        <div class="pb-rail__fonts">
          <select id="pb-hand" aria-label="The hand PrepBot writes in"></select>
        </div>
        <button type="button" class="pb-ico" id="pb-overview" data-tip="See the whole canvas" data-tip-side="right" aria-label="See the whole canvas" data-ico="overview"></button>
        <button type="button" class="pb-ico" id="pb-new" data-tip="New board" data-tip-side="right" aria-label="New board" data-ico="again"></button>
      </nav>

      <!-- the bottom dock: talk, a hint, a raised hand (which opens the typing box) -->
      <div class="pb-dock">
        <p class="pb-status" id="pb-status" aria-live="polite"></p>
        <form class="pb-ask" id="pb-ask" autocomplete="off" hidden>
          <input id="pb-input" type="text" maxlength="400" placeholder="Type your question…" aria-label="Your question" />
          <button type="submit" class="pb-ico" id="pb-send" data-tip="Send" data-tip-side="top" aria-label="Send" data-ico="send"></button>
        </form>
        <div class="pb-dock__keys">
          <button type="button" class="pb-ico pb-hint" id="pb-hint" data-tip="I'm stuck: give me a hint" data-tip-side="top" aria-label="Give me a hint" data-ico="bulb"></button>
          <button type="button" class="pb-ico pb-ico--big" id="pb-mic" data-tip="Hold to talk, or tap and pause" data-tip-side="top" aria-label="Hold to talk" aria-pressed="false" data-ico="mic"></button>
          <button type="button" class="pb-ico pb-hand-up" id="pb-raise" data-tip="Raise your hand to type a question" data-tip-side="top" aria-label="Raise your hand" data-ico="hand"></button>
        </div>
      </div>
    </main>

    <script type="module" src="/prepbot-board/js/main.js"></script>
  </body>
</html>
