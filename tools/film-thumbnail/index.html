<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>PrepBot Video Thumbnails</title>
  <!--
    YOUTUBE THUMBNAILS FOR PREPBOT'S FILMS (1280 x 720) - ONE COMPONENT, BUILT FROM OURS

    *"The thumbnails doesn't use our UI components. It is also poorly designed. Stick with our
    colours too."* So the thumbnail is made of the site's own pieces, at poster size:
      - the film's name on a RECEIPT (.pp-receipt wrapper > .pp-receipt__paper: shadow, teeth, holes)
      - its tags as PILLS (.pp-pill)
      - the subject's sign on taped STICKY NOTES (.pp-sticky, the six note papers), PrepBot on top
      - the address on a pill, on the site's cream paper with the workbook's faint squares
    and only the theme's colours: ink #2a2723, cream paper, the note pastels, the yellow accent.
    A subject is one entry in SUBJECTS (its note paper and its sign); the NAME is the only other change.

    ?film=<id>      one thumbnail        (&shot=1: exactly 1280 x 720, for the PNG)
    (no film)       the gallery: every film's PNG to download (png/<id>.png)
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@500;700;800&family=Shantell+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/utils/components/theme.css" />
  <link rel="stylesheet" href="/utils/components/components.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--app-bg, #f0ece3); color: var(--ink, #2a2723); font-family: "JetBrains Mono", monospace; }
    body.shot { background: var(--bg, #faf7f1); }
    .wrap { padding: 24px 16px 48px; max-width: 1320px; margin: 0 auto; }
    h1 { font: 900 22px/1.2 Unbounded, sans-serif; margin: 0 0 6px; }
    .lead { margin: 0 0 18px; color: var(--text-secondary, #6b655c); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    .card.pp-receipt { display: block; }
    .card .pp-receipt__paper { padding: 14px 20px 16px; background-color: var(--surface-primary, #fffdf8); }
    .card img { display: block; width: 100%; aspect-ratio: 16/9; background: var(--bg, #faf7f1); }
    .card p { margin: 10px 0 2px; font-weight: 700; font-size: 12.5px; }
    .card small { color: var(--text-secondary, #6b655c); font-size: 11px; }
    .card .row { display: flex; gap: 10px; margin-top: 10px; }
    .scale { transform-origin: 0 0; }

    /* ── THE THUMBNAIL ─────────────────────────────────────────────────────────
       --note: the subject's note paper; --note2: the one tucked behind it */
    .thumb { position: relative; width: 1280px; height: 720px; overflow: hidden; color: #2a2723;
      background-color: #faf7f1;
      background-image: linear-gradient(rgba(42,39,35,.055) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(42,39,35,.055) 1.5px, transparent 1.5px);
      background-size: 48px 48px; background-position: -1px -1px; }

    /* the receipt: the film's name */
    .thumb__card.pp-receipt { position: absolute; left: 64px; top: 58px; width: 700px; transform: rotate(-1.2deg); }
    .thumb__card .pp-receipt__paper { padding: 46px 58px 50px; background-color: #fffdf8; }
    .thumb__kicker { display: flex; align-items: center; gap: 16px; margin: 0;
      font: 800 24px/1 "JetBrains Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: #6b655c; }
    .thumb__kicker i { width: 16px; height: 16px; border-radius: 50%; background: var(--note-deep); flex: none; }
    .thumb__rule { display: block; margin: 22px 0 24px; border-top: 3px dashed rgba(42,39,35,.35); }
    .thumb__title { margin: 0; font: 900 60px/1.08 Unbounded, sans-serif; letter-spacing: -.015em; color: #2a2723; text-wrap: balance; }
    .thumb__title em { font-style: normal; padding: 0 .08em; background: linear-gradient(transparent 58%, #f4c95d 58%, #f4c95d 92%, transparent 92%); }
    .thumb__tags { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 34px; }
    .thumb .pp-pill { font-size: 22px; padding: 12px 20px; gap: 12px; border-width: 3px; color: #2a2723; cursor: default;
      box-shadow: 0 6px 14px -6px rgba(42,39,35,.35); }
    /* the tags are sticky notes, taped on, each its own paper and its own tilt */
    .thumb__tags { gap: 26px; align-items: center; }
    .thumb__tag.pp-sticky { position: relative; display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px 15px;
      font-size: 28px; font-weight: 800; }
    .thumb__tag.pp-sticky--tape::before { width: 70px; height: 22px; top: -12px; }
    .thumb__tag svg { width: 28px; height: 28px; }
    /* the logo, faint, behind everything */
    .thumb__mark { position: absolute; width: 420px; height: 420px; left: 50%; top: 66%; transform: translate(-50%, -50%) rotate(-8deg); opacity: .1; pointer-events: none; }

    /* the notes: the subject's sign, PrepBot on top */
    .thumb__notes { position: absolute; right: 70px; top: 96px; width: 400px; height: 420px; }
    .thumb__notes .pp-sticky { position: absolute; display: block; padding: 0; }
    .thumb__back.pp-sticky { left: 34px; top: 26px; width: 340px; height: 320px; --pp-note-tilt: -7deg; background: var(--note2); }
    .thumb__front.pp-sticky { left: 0; top: 0; width: 360px; height: 340px; --pp-note-tilt: 3deg; background: var(--note);
      display: grid; place-items: center; }
    .thumb__front.pp-sticky--tape::before { width: 120px; height: 34px; top: -18px; }
    .thumb__front svg { width: 82%; height: 72%; }
    .thumb__word { position: absolute; left: 40px; right: 0; bottom: 26px; text-align: center;
      font: 800 34px/1 "Shantell Sans", cursive; color: #14130f; }
    .thumb__bot { position: absolute; left: -150px; bottom: -96px; width: 190px; height: 190px; transform: rotate(-9deg);
      filter: drop-shadow(0 12px 14px rgba(42,39,35,.28)); }
    .thumb__bot svg { width: 100%; height: 100%; }

    .thumb__brand { position: absolute; left: 70px; bottom: 44px; display: flex; align-items: center; gap: 14px;
      font: 900 30px/1 Unbounded, sans-serif; color: #2a2723; }
    .thumb__brand span { background: linear-gradient(transparent 55%, #f4c95d 55%); padding: 0 .06em; }
    .thumb__url.pp-pill { position: absolute; right: 70px; bottom: 38px; font-size: 24px; text-transform: none; letter-spacing: .02em;
      font-weight: 800; background: #fffdf8; }

    /* ── THE PLAYLIST COVER: the topic on the receipt, how many videos on a note, and the playlist's
       own video thumbnails fanned out like photos pinned to the board ── */
    .pl__fan { position: absolute; right: 40px; top: 70px; width: 520px; height: 470px; }
    .pl__shot { position: absolute; width: 380px; aspect-ratio: 16 / 9; background: #fffdf8; padding: 8px;
      box-shadow: 0 2px 2px rgba(42,39,35,.12), 10px 16px 26px -10px rgba(42,39,35,.45); }
    .pl__shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .pl__shot--0 { left: 0; top: 230px; transform: rotate(-7deg); }
    .pl__shot--1 { left: 120px; top: 120px; transform: rotate(4deg); }
    .pl__shot--2 { left: 60px; top: 0; transform: rotate(-3deg); }
    .pl__shot::before { content: ""; position: absolute; top: -12px; left: 50%; width: 90px; height: 26px; transform: translateX(-50%) rotate(-3deg);
      background: rgba(255,255,255,.55); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
    .pl__count.pp-sticky { position: absolute; display: inline-flex; align-items: baseline; gap: 12px; padding: 16px 26px 18px; font-size: 30px; font-weight: 800; }
    .pl__count b { font: 900 54px/1 Unbounded, sans-serif; }
    .pl__topics { margin: 26px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 10px 12px; }
    .pl__topics li { font: 700 19px/1 "JetBrains Mono", monospace; color: #2a2723; padding: 9px 14px; border: 2px dashed rgba(42,39,35,.3); background: #fffdf8; }
  </style>
</head>
<body>
  <div class="wrap" id="gallery" hidden>
    <h1>PrepBot video thumbnails</h1>
    <p class="lead">1280 × 720, ready for YouTube. One design for every film: only the name changes, and each subject has its own note paper.</p>
    <div class="grid" id="grid"></div>
  </div>
  <div id="one" hidden><div class="scale" id="scale"><div id="slot"></div></div></div>
  <script type="module">
    import { FILMS } from "/utils/components/workbook/tv-lessons.js";
    import { ICON_PREPBOT } from "/prep-math/mental-math/shared/icons.js";
    import { UI } from "/utils/components/ui-icons.js";

    const INK = "#2a2723";
    /* ONE ENTRY PER SUBJECT: its name, its note papers (the site's sticky pastels), a deeper dot
       for the kicker (the theme's accents), the word on the note, and the sign drawn in ink */
    const SUBJECTS = {
      percent: { name: "Percentages", note: "#bfe3ff", note2: "#fff3a8", deep: "#6fb7e8", word: "per cent",
        sign: () => `<svg viewBox="0 0 160 110"><text x="80" y="88" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="96" fill="${INK}">%</text></svg>` },
      ratio: { name: "Ratio", note: "#c8f0c0", note2: "#ffd7a3", deep: "#7cc47c", word: "share it out",
        sign: () => `<svg viewBox="0 0 160 110">${[0, 1, 2].map((i) => `<rect x="${6 + i * 26}" y="20" width="24" height="24" fill="#fff3a8" stroke="${INK}" stroke-width="3.2"/>`).join("")}`
          + `${[0, 1].map((i) => `<rect x="${6 + i * 26}" y="54" width="24" height="24" fill="#bfe3ff" stroke="${INK}" stroke-width="3.2"/>`).join("")}`
          + `<text x="124" y="66" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="30" fill="${INK}">3:2</text></svg>` },
      patterns: { name: "Patterns", note: "#e8c8ff", note2: "#b8ece2", deep: "#b8a8e8", word: "spot the rule",
        sign: () => `<svg viewBox="0 0 160 110">${[1, 2, 3, 4].flatMap((h, x) => Array.from({ length: h }, (_, y) => `<rect x="${32 + x * 24}" y="${96 - (y + 1) * 20}" width="24" height="20" fill="${(x + y) % 2 ? "#fffdf8" : "#fff3a8"}" stroke="${INK}" stroke-width="2.8"/>`)).join("")}</svg>` },
      averages: { name: "Averages", note: "#b8ece2", note2: "#fff3a8", deep: "#5fb8a8", word: "share it fairly",
        sign: () => `<svg viewBox="0 0 160 110">${[2, 7, 4, 6, 6].map((h, i) => `<rect x="${22 + i * 24}" y="${96 - h * 11}" width="20" height="${h * 11}" fill="${["#bfe3ff", "#fff3a8", "#bfe3ff", "#fff3a8", "#bfe3ff"][i]}" stroke="${INK}" stroke-width="3"/>`).join("")}`
          + `<path d="M14 41 H146" stroke="#c0453f" stroke-width="3.4" stroke-dasharray="9 6"/></svg>` },
      algebra: { name: "Algebra", note: "#e8c8ff", note2: "#bfe3ff", deep: "#b8a8e8", word: "complete the square",
        sign: () => `<svg viewBox="0 0 160 110"><rect x="30" y="14" width="62" height="62" fill="#bfe3ff" stroke="${INK}" stroke-width="3"/><rect x="92" y="14" width="16" height="62" fill="#fff3a8" stroke="${INK}" stroke-width="3"/>`
          + `<rect x="30" y="76" width="62" height="16" fill="#fff3a8" stroke="${INK}" stroke-width="3"/><rect x="92" y="76" width="16" height="16" fill="#ffd7a3" stroke="#c0453f" stroke-width="3" stroke-dasharray="5 3"/>`
          + `<text x="61" y="52" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="22" fill="${INK}">x²</text></svg>` },
      maths: { name: "Maths", note: "#ffd7a3", note2: "#bfe3ff", deep: "#f0a868", word: "work it out",
        sign: () => `<svg viewBox="0 0 160 110"><text x="80" y="70" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="46" fill="${INK}">+ − × ÷</text></svg>` },
    };

    /* THE COMPONENT: everything is fixed but the name, and the subject's papers */
    function thumbnail({ name, topic, lesson }) {
      const s = SUBJECTS[topic] || SUBJECTS.maths;
      /* the first pill counts the film's ways from its name: "(three ways)" is 3 WAYS; a film
         with no ways in its name is a lesson */
      const WAYS = { two: 2, three: 3, four: 4 };
      const w = (name.match(/\((two|three|four) ways\)\s*$/i) || [])[1];
      const first = w ? `${WAYS[w.toLowerCase()]} ways` : (lesson ? "Lesson" : "Worked question");
      const title = name.replace(/\s*\((?:two|three|four) ways\)\s*$/i, "")
        .replace(/(\d[\d,.]*%|[₦$]\d[\d,]*|\d+\s*:\s*\d+(?:\s*:\s*\d+)*|\b\d[\d,]*\b)/, "<em>$1</em>");
      return `<div class="thumb" style="--note:${s.note};--note2:${s.note2};--note-deep:${s.deep}">`
        + `<img class="thumb__mark" src="/logo/logo-light.svg" alt="">`
        + `<div class="thumb__card pp-receipt"><div class="pp-receipt__paper">`
        + `<p class="thumb__kicker"><i></i>PrepBot TV · ${s.name}</p><span class="thumb__rule"></span>`
        + `<h2 class="thumb__title">${title}</h2>`
        + `<div class="thumb__tags"><span class="thumb__tag pp-sticky pp-sticky--tape pp-sticky--c0" style="--pp-note-tilt:-3deg">${UI.play(28)}${first}</span>`
        + `<span class="thumb__tag pp-sticky pp-sticky--c3" style="--pp-note-tilt:2deg">${UI.steps ? UI.steps(28) : ""}Step by step</span></div>`
        + `</div></div>`
        + `<div class="thumb__notes"><span class="thumb__back pp-sticky"></span>`
        + `<div class="thumb__front pp-sticky pp-sticky--tape">${s.sign()}<span class="thumb__word">${s.word}</span>`
        + `<div class="thumb__bot">${ICON_PREPBOT}</div></div></div>`
        + `<div class="thumb__brand">Learning with <span>PrepBot</span></div>`
        + `<span class="thumb__url pp-pill" style="--tile:${s.deep}">prepportal.com.ng</span>`
        + `</div>`;
    }


    /* THE PLAYLIST COVER: ?playlist=<topic>. The subject's papers and sign, its name big, how many
       videos (a sticky note), what it covers (from the lesson names), and three of its videos fanned */
    const PLAYLISTS = {
      ratio: { title: "Ratio, step by step", blurb: ["What a ratio is", "Part, whole, difference", "Compound ratio", "Squares and cubes", "Ages, shapes"] },
      percent: { title: "Percentages, step by step", blurb: ["Out of a hundred", "Percent of an amount", "Increase, decrease", "Reverse percentages"] },
      averages: { title: "Mean, median, mode, range", blurb: ["Share it fairly", "Median and mode", "Totals", "Competition questions"] },
      algebra: { title: "Algebra derivations", blurb: ["The quadratic formula", "Completing the square", "With pictures"] },
      patterns: { title: "Sequences and series", blurb: ["Find the rule", "The nth term", "Adding a series", "Shapes that grow"] },
    };
    function playlistCover(topic) {
      const s = SUBJECTS[topic] || SUBJECTS.maths, pl = PLAYLISTS[topic] || { title: s.name, blurb: [] };
      const films = FILMS.filter((f) => f.topic === topic);
      const lessons = films.filter((f) => f.lesson), rest = films.filter((f) => !f.lesson);
      const picks = [...lessons, ...rest].slice(0, 3).reverse();
      return `<div class="thumb" style="--note:${s.note};--note2:${s.note2};--note-deep:${s.deep}">`
        + `<img class="thumb__mark" src="/logo/logo-light.svg" alt="">`
        + `<div class="thumb__card pp-receipt" style="width:640px"><div class="pp-receipt__paper">`
        + `<p class="thumb__kicker"><i></i>PrepBot TV · Playlist</p><span class="thumb__rule"></span>`
        + `<h2 class="thumb__title">${pl.title}</h2>`
        + `<ul class="pl__topics">${pl.blurb.map((b) => `<li>${b}</li>`).join("")}</ul>`
        + `</div></div>`
        + `<div class="pl__fan">${picks.map((f, i) => `<div class="pl__shot pl__shot--${i}"><img src="png/${f.id}.png" alt=""></div>`).join("")}</div>`
        + `<span class="pl__count pp-sticky pp-sticky--tape" style="left:600px;top:520px;--pp-note-bg:${s.note};--pp-note-tilt:-4deg"><b>${films.length}</b> videos</span>`
        + `<div class="thumb__brand">Learning with <span>PrepBot</span></div>`
        + `<span class="thumb__url pp-pill" style="--tile:${s.deep}">prepportal.com.ng</span>`
        + `</div>`;
    }
    const params = new URLSearchParams(location.search);
    const id = params.get("film"), plist = params.get("playlist");
    if (plist) {
      document.getElementById("one").hidden = false;
      document.getElementById("slot").innerHTML = playlistCover(plist);
      if (params.get("shot")) document.body.classList.add("shot");
      else {
        const fit = () => { const k = Math.min(1, (innerWidth - 32) / 1280); const sc = document.getElementById("scale"); sc.style.transform = `scale(${k})`; sc.style.margin = "16px"; };
        fit(); addEventListener("resize", fit);
      }
      await document.fonts.ready;
      await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
      document.body.dataset.ready = "1";
    } else if (!id) {
      document.getElementById("gallery").hidden = false;
      document.getElementById("grid").innerHTML = Object.keys(PLAYLISTS).map((t) => `
        <div class="card pp-receipt"><div class="pp-receipt__paper">
          <a href="?playlist=${t}" target="_blank" rel="noopener"><img src="png/playlist-${t}.png" alt="Playlist cover: ${PLAYLISTS[t].title}" loading="lazy"></a>
          <p>Playlist: ${PLAYLISTS[t].title}</p><small>${FILMS.filter((f) => f.topic === t).length} videos</small>
          <div class="row"><a class="pp-pill" href="png/playlist-${t}.png" download="prepbot-playlist-${t}.png">${UI.download(15)}Download</a><a class="pp-pill" href="?playlist=${t}" target="_blank" rel="noopener">Open</a></div>
        </div></div>`).join("") + FILMS.filter((f) => f.topic).map((f) => `
        <div class="card pp-receipt"><div class="pp-receipt__paper">
          <a href="?film=${f.id}" target="_blank" rel="noopener"><img src="png/${f.id}.png" alt="Thumbnail: ${f.name}" loading="lazy"></a>
          <p>${f.name}</p><small>${f.of || ""}</small>
          <div class="row"><a class="pp-pill" href="png/${f.id}.png" download="prepbot-${f.id}.png">${UI.download(15)}Download</a><a class="pp-pill" href="?film=${f.id}" target="_blank" rel="noopener">${UI.external ? UI.external(15) : ""}Open</a></div>
        </div></div>`).join("");
    } else {
      const f = FILMS.find((x) => x.id === id) || { name: id };
      document.getElementById("one").hidden = false;
      document.getElementById("slot").innerHTML = thumbnail(f);
      if (params.get("shot")) document.body.classList.add("shot");
      else {
        const fit = () => { const k = Math.min(1, (innerWidth - 32) / 1280); const sc = document.getElementById("scale"); sc.style.transform = `scale(${k})`; sc.style.margin = "16px"; };
        fit(); addEventListener("resize", fit);
      }
      await document.fonts.ready;
      document.body.dataset.ready = "1";
    }
  </script>
</body>
</html>
