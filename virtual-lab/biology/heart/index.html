<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Heart Model</title>
<meta name="description" content="Interactive 3D heart: take it apart, cut through the chambers and valves, and watch the cardiac cycle.">
<link rel="stylesheet" href="/utils/components/theme.css">
<link rel="stylesheet" href="/utils/components/components.css">
<style>
  /* Page layout only. Colours, shadows, fonts and components come from theme.css and components.css. */
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  [hidden] { display: none !important; }

  /* Pills on this site are square */
  .pp-pill { border-radius: var(--radius-none, 0); }

  /* Paint-blob background: the site's logo motif (DESIGN.md section 6) */
  .heart-paint { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: .26; }
  .heart-paint svg { width: 100%; height: 100%; display: block; }
  [data-theme="dark"] .heart-paint { opacity: .15; }

  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .heart-layer { position: fixed; z-index: 2; }

  /* Top bar */
  .heart-top { top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .heart-top .pp-pill { text-decoration: none; }

  /* Controls: a narrow receipt down the left with plain icon keys, sized like
     the workbook side rail (utils/components/workbook.css .wb-side__btn): no
     note behind an icon, a soft wash on hover, the rail's yellow when on.
     Each key says what it does in the site tooltip (data-tip) and its label. */
  .heart-rail { top: 50%; left: 16px; transform: translateY(-50%); }
  .heart-rail .pp-receipt__paper { --tooth: 7px; padding: 0.75rem 0.7rem; }
  .heart-keys { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .heart-key {
    display: grid; place-items: center; width: 2.35rem; height: 2.35rem; padding: 0;
    color: var(--text-primary); background: transparent; border: 1.5px solid transparent;
    border-radius: 0; cursor: pointer;
  }
  .heart-key svg { width: 19px; height: 19px; }
  .heart-key:hover { background: var(--surface-secondary, rgba(42, 39, 35, 0.06)); }
  .heart-key:focus-visible { outline: 2px solid #f4c95d; outline-offset: 1px; }
  .heart-key[aria-pressed="true"] { background: #fff3a8; border-color: rgba(20, 19, 15, 0.35); }
  .heart-rule { width: 1.6rem; height: 1px; margin: 0.15rem 0; background: rgba(42, 39, 35, 0.16); }
  /* the tooltip's invisible anchor: it follows the pointer over the model */
  .heart-tip-anchor { position: fixed; width: 1px; height: 1px; pointer-events: none; z-index: 4; }

  /* Dials: free on the page, bottom right — no card round them */
  .heart-dials { right: 20px; bottom: 18px; display: flex; align-items: flex-end; gap: 22px; }
  /* the shared dial (utils/components/dial.js) sizes itself to its host */
  .heart-dial { width: 112px; }
  .heart-dial-group { display: inline-flex; align-items: flex-end; gap: 12px; }
  .heart-seg { display: inline-flex; flex-direction: column; gap: 0.3rem; margin-bottom: 26px;
    padding: 0.3rem; background: var(--surface-primary, #fffdf8); box-shadow: var(--shadow-sm, 0 2px 8px rgba(42, 39, 35, .12)); }
  .pp-visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Loading note */
  .heart-loading { top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-2deg); z-index: 3; transition: opacity .4s; }
  .heart-loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {
    .heart-top { top: 10px; left: 10px; right: 10px; }
    .heart-rail { left: 8px; }
    .heart-rail .pp-receipt__paper { padding: 0.6rem 0.45rem; }
    /* 44px: what a finger needs */
    .heart-key { width: 2.75rem; height: 2.75rem; }
    .heart-key svg { width: 22px; height: 22px; }
    .heart-wire { display: none !important; }
    .heart-dials { right: 10px; bottom: 10px; gap: 12px; }
    .heart-dial { width: 88px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="heart-paint" id="paint" aria-hidden="true"></div>
<div id="stage"></div>

<header class="heart-layer heart-top">
  <a class="pp-pill" href="/virtual-lab/index.html"><span data-icon="chevronLeft" aria-hidden="true"></span> Virtual lab</a>
</header>

<h1 class="pp-visually-hidden">The human heart</h1>


<nav class="heart-layer heart-rail pp-receipt" aria-label="Model controls">
  <div class="pp-receipt__paper">
    <div class="heart-keys">
      <button class="heart-key pp-plain" id="btnExplode" type="button" aria-pressed="false" data-tip="Take it apart" data-tip-side="right" aria-label="Take it apart"><span data-hicon="apart" aria-hidden="true"></span></button>
      <button class="heart-key pp-plain" id="btnSection" type="button" aria-pressed="false" data-tip="Cut it open" data-tip-side="right" aria-label="Cut it open"><span data-hicon="cut" aria-hidden="true"></span></button>
      <button class="heart-key pp-plain" id="btnBeat" type="button" aria-pressed="true" data-tip="Heartbeat" data-tip-side="right" aria-label="Heartbeat"><span data-hicon="beat" aria-hidden="true"></span></button>
      <button class="heart-key pp-plain" id="btnCoronary" type="button" aria-pressed="true" data-tip="Coronary vessels" data-tip-side="right" aria-label="Coronary vessels"><span data-hicon="vessels" aria-hidden="true"></span></button>
      <button class="heart-key pp-plain" id="btnRotate" type="button" aria-pressed="true" data-tip="Spin" data-tip-side="right" aria-label="Spin"><span data-hicon="spin" aria-hidden="true"></span></button>
      <button class="heart-key pp-plain heart-wire" id="btnWire" type="button" aria-pressed="false" data-tip="Wireframe" data-tip-side="right" aria-label="Wireframe"><span data-hicon="wire" aria-hidden="true"></span></button>
      <span class="heart-rule" aria-hidden="true"></span>
      <button class="heart-key pp-plain" id="btnReset" type="button" data-tip="Reset view" data-tip-side="right" aria-label="Reset view"><span data-hicon="reset" aria-hidden="true"></span></button>
    </div>
  </div>
</nav>

<div class="heart-layer heart-dials">
  <div class="heart-dial" id="rateDial"></div>
  <div class="heart-dial-group" id="sectionGroup" hidden>
    <div class="heart-seg" role="group" aria-label="Cut direction">
      <button class="heart-key pp-plain" type="button" data-axis="front" aria-pressed="true" data-tip="Cut from the front" data-tip-side="left" aria-label="Cut from the front"><span data-hicon="cut-front" aria-hidden="true"></span></button>
      <button class="heart-key pp-plain" type="button" data-axis="top" aria-pressed="false" data-tip="Cut from the top" data-tip-side="left" aria-label="Cut from the top"><span data-hicon="cut-top" aria-hidden="true"></span></button>
      <button class="heart-key pp-plain" type="button" data-axis="side" aria-pressed="false" data-tip="Cut from the side" data-tip-side="left" aria-label="Cut from the side"><span data-hicon="cut-side" aria-hidden="true"></span></button>
    </div>
    <div class="heart-dial" id="depthDial"></div>
  </div>
</div>

<span class="heart-tip-anchor" id="partTip" aria-hidden="true"></span>

<div class="heart-layer pp-sticky pp-sticky--c0 pp-sticky--tape heart-loading" id="loading" role="status" style="--pp-note-tilt:-2deg">
  <span id="loadingText">Loading heart…</span>
</div>

<script type="module" src="./heart.js"></script>
</body>
</html>
