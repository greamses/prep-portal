name: Spelling audio

# Records the Drills spelling lists (data/spelling/lower-primary.js, upper-primary.js,
# secondary.js) with Kokoro, a free speech model, on GitHub's machines. The clips are
# committed to the repo's `spelling-audio` branch (<list>/<voice>/NNNN-w|d|s|o.mp3), which holds
# nothing else, and the site plays them through jsDelivr (a free CDN for public GitHub repos).
# They never land on anyone's own disk: local clones are set not to fetch that branch. Only
# the small list of which clips exist (data/spelling/audio.js) comes back here.
#
# Runs when a word list or the recorder changes, or from the Actions tab. A clip already on
# the branch is skipped, so a re-run only records what is missing. See tools/spelling-audio.

on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "What to record: w (words), d (definitions), s (sentences), o (part of speech, origin and root)"
        default: "w,d,s,o"
  push:
    branches-ignore: [spelling-audio]
    paths:
      - data/spelling/secondary.js
      - data/spelling/upper-primary.js
      - data/spelling/lower-primary.js
      - data/spelling/roots.js
      - data/spelling/phrases.js
      - data/spelling/letters.js
      - data/spelling/speller-voices.js
      - tools/spelling-audio/*.mjs
      - tools/spelling-audio/package.json
      - tools/spelling-audio/redo.txt
      - .github/workflows/spelling-audio.yml

concurrency:
  group: spelling-audio
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # A list and a slice of it per machine. A slice already recorded exits at once.
      matrix:
        include:
          - { bank: lower, part: 1/3 }
          - { bank: lower, part: 2/3 }
          - { bank: lower, part: 3/3 }
          - { bank: upper, part: 1/5 }
          - { bank: upper, part: 2/5 }
          - { bank: upper, part: 3/5 }
          - { bank: upper, part: 4/5 }
          - { bank: upper, part: 5/5 }
          - { bank: secondary, part: 1/2 }
          - { bank: secondary, part: 2/2 }
          - { bank: phrases, part: 1/1 }
          # The Spelling Bee's spellers, in their own voices (data/spelling/speller-voices.js):
          # each letter's name, and every word, which a speller says when they are done.
          - { bank: letters, part: 1/1, voice: bf_lily, kinds: w }
          - { bank: letters, part: 1/1, voice: bm_fable, kinds: w }
          - { bank: lower, part: 1/1, voice: bf_lily, kinds: w }
          - { bank: lower, part: 1/1, voice: bm_fable, kinds: w }
          - { bank: upper, part: 1/2, voice: bf_lily, kinds: w }
          - { bank: upper, part: 2/2, voice: bf_lily, kinds: w }
          - { bank: upper, part: 1/2, voice: bm_fable, kinds: w }
          - { bank: upper, part: 2/2, voice: bm_fable, kinds: w }
          - { bank: secondary, part: 1/2, voice: bf_lily, kinds: w }
          - { bank: secondary, part: 2/2, voice: bf_lily, kinds: w }
          - { bank: secondary, part: 1/2, voice: bm_fable, kinds: w }
          - { bank: secondary, part: 2/2, voice: bm_fable, kinds: w }
    steps:
      - uses: actions/checkout@v4
      - name: The clips made so far
        uses: actions/checkout@v4
        with:
          ref: spelling-audio
          path: store
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the recorder
        working-directory: tools/spelling-audio
        run: npm install --no-audit --no-fund
      - name: Cache the Kokoro model
        uses: actions/cache@v4
        with:
          path: tools/spelling-audio/node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-v1.0-onnx
      - name: Record what is missing in ${{ matrix.bank }} ${{ matrix.part }} ${{ matrix.voice }}
        working-directory: tools/spelling-audio
        run: |
          # the row's own voice (a speller's), or the lists' voice
          VOICE="${{ matrix.voice }}"
          if [ -z "$VOICE" ]; then VOICE=$(node -p "require('fs').readFileSync('voice-name.mjs','utf8').match(/'([a-z_]+)';/)[1]"); fi
          export VOICE
          node record.mjs --bank ${{ matrix.bank }} --part ${{ matrix.part }} --kinds ${{ matrix.kinds || inputs.kinds || 'w,d,s,o' }} --redo redo.txt \
            --have "$GITHUB_WORKSPACE/store/${{ matrix.bank }}/$VOICE" --out "$GITHUB_WORKSPACE/new/${{ matrix.bank }}/$VOICE"
      - name: Hand the new clips on
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ strategy.job-index }}
          path: new
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: record
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: spelling-audio
          path: store
      - name: Gather the new clips
        uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          merge-multiple: true
          path: store
      - name: Commit them to the spelling-audio branch
        id: store
        working-directory: store
        run: |
          git config user.name "prep-portal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No new clips."; else
            git commit -q -m "Spelling audio: $(git diff --cached --name-only | wc -l) new clips"
            git push -q
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: List the clips for the site, pinned to that commit
        run: |
          node tools/spelling-audio/manifest.mjs --root store --sha ${{ steps.store.outputs.sha }}
      - name: Commit the list if it changed
        run: |
          git config user.name "prep-portal-bot"
          git config user.email "bot@users.noreply.github.com"
          # Only the clip list: page stamps are left to the deploy (version-assets runs before it),
          # so a commit pushed while this ran can never conflict with the bot's.
          # the redo list has been recorded again: empty it, so the next run does not repeat it
          if [ -s tools/spelling-audio/redo.txt ] && [ "${{ needs.record.result }}" = "success" ]; then
            : > tools/spelling-audio/redo.txt
            git add tools/spelling-audio/redo.txt
          fi
          git add data/spelling/audio.js
          if git diff --cached --quiet; then echo "Nothing new."; else
            git commit -q -m "Spelling: list the Kokoro clips (spelling-audio@${{ steps.store.outputs.sha }})"
            # version-assets may also restamp pages it does not commit; stash those for the rebase
            git pull -q --rebase --autostash
            git push -q
          fi
