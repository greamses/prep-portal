<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- seo:head -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- /seo:head -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Prep Portal | Weekly results</title>
    <meta name="description" content="A teacher's weekly results compiler: every student's scores for the assignments they completed, week by week, with a graph for each." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;900&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Shantell+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
    <link rel="stylesheet" href="/results-compiler/style.css" />

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
        }
      }
    </script>

    <script src="/utils/components/loader.js"></script>
    <!-- a teacher's page: an account, and the server says whether it is a teacher's -->
    <script type="module" src="/utils/auth/login-guard.js"></script>
  </head>
  <body>
    <nav class="site-nav" data-nav="main"></nav>
    <main class="rc-main">
      <header class="rc-hero no-print">
        <span class="rc-eyebrow">For teachers</span>
        <h1 class="rc-title">Weekly results<em>.</em></h1>
        <p class="rc-lead">
          Every score your class sent back for the assignments and shared papers they finished,
          gathered week by week, with a graph for each student. Print it for the file or send a page home.
        </p>
      </header>

      <section class="rc-controls pp-receipt no-print" aria-label="Which weeks">
        <div class="pp-receipt__paper rc-controls__paper">
          <button class="pp-btn" id="rc-prev" type="button"></button>
          <label class="rc-field"><span>Weeks starting</span><input type="date" id="rc-start" /></label>
          <label class="rc-field"><span>How many</span>
            <select id="rc-weeks"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option></select></label>
          <button class="pp-btn" id="rc-next" type="button"></button>
          <label class="rc-toggle"><input type="checkbox" id="rc-pages" /> One student to a page when printed</label>
          <span class="rc-spacer"></span>
          <button class="pp-btn" id="rc-print" type="button"></button>
        </div>
      </section>

      <p class="rc-msg no-print" id="rc-msg" role="status">Gathering the scores…</p>
      <div id="rc-report"></div>
    </main>

    <script type="module" src="/utils/components/nav-builder.js"></script>
    <script type="module" src="/results-compiler/main.js"></script>
  </body>
</html>
