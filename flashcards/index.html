<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Flashcards — Recall Press</title>
    <meta name="description" content="Print a fresh deck of AI flashcards for any class, subject and topic — then polish the wording and add images before students see them." />

    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <meta name="theme-color" content="#b8a8e8" />

    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;600;700&family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/utils/components/theme.css" />
    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="/utils/components/select.css" />
    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
        }
      }
    </script>
    <script type="module" src="/utils/auth/premium-guard.js"></script>
    <script type="module" src="./js/creator-guard.js"></script>
      <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
  </head>

  <body>
    <nav class="site-nav" data-nav="main"></nav>

    <div class="builder-paint" aria-hidden="true"></div>

    <!-- ═══ HERO ═══ -->
    <header class="builder-header">
      <div class="cards-tabs" role="tablist">
        <a class="pp-pill cards-tab" href="/flashcards/library.html" role="tab">My Decks</a>
        <a class="pp-pill cards-tab is-active" href="/flashcards/index.html" role="tab">Print &amp; Edit</a>
        <a class="pp-pill cards-tab" href="/flashcards/facts.html" role="tab">Facts</a>
      </div>
    </header>

    <!-- ═══ THE PRESS — setup + generation ═══ -->
    <main class="press-section">
      <div class="press-section-hdr">
        <div class="setup-eyebrow">Load the Press</div>
        <h2>Print a New Deck</h2>
        <p class="press-section-sub">Choose what to study — we'll do the rest.</p>
      </div>

      <div class="press-rig" id="press-rig">
        <div class="press-form">
          <label class="press-field">
            <span>Class</span>
            <select id="cls-select">
              <option value="" disabled selected>Class</option>
              <optgroup label="Primary (Lower)">
                <option value="Primary 1|primary-lower">Primary 1</option>
                <option value="Primary 2|primary-lower">Primary 2</option>
                <option value="Primary 3|primary-lower">Primary 3</option>
              </optgroup>
              <optgroup label="Primary (Upper)">
                <option value="Primary 4|primary-upper">Primary 4</option>
                <option value="Primary 5|primary-upper">Primary 5</option>
                <option value="Primary 6|primary-upper">Primary 6</option>
              </optgroup>
              <optgroup label="Junior Secondary">
                <option value="JSS 1|jss">JSS 1</option>
                <option value="JSS 2|jss">JSS 2</option>
                <option value="JSS 3|jss">JSS 3</option>
              </optgroup>
              <optgroup label="Senior Secondary">
                <option value="SS 1|ss">SS 1</option>
                <option value="SS 2|ss">SS 2</option>
                <option value="SS 3|ss">SS 3</option>
              </optgroup>
            </select>
          </label>

          <label class="press-field" id="track-field" hidden>
            <span>Track</span>
            <select id="track-select">
              <option value="" disabled selected>Track</option>
              <option value="science">Science</option>
              <option value="arts">Arts</option>
              <option value="commercial">Commercial</option>
            </select>
          </label>

          <label class="press-field">
            <span>Subject</span>
            <select id="subject-select" disabled>
              <option value="" disabled selected>Subject</option>
            </select>
          </label>

          <label class="press-field">
            <span>Topic</span>
            <input id="topic-input" type="text" placeholder="e.g. Photosynthesis, Simultaneous Equations…" maxlength="120" />
          </label>

          <div class="press-field">
            <span>How many cards?</span>
            <div class="count-tiles" id="count-tiles">
              <button type="button" class="count-tile" data-n="5">5</button>
              <button type="button" class="count-tile active" data-n="10">10</button>
              <button type="button" class="count-tile" data-n="15">15</button>
              <button type="button" class="count-tile" data-n="20">20</button>
            </div>
          </div>

          <button class="press-btn" id="run-press-btn" type="button" disabled>
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="16" height="16"><rect x="6.8" y="2.6" width="10.4" height="5.8" rx="1.3" fill="var(--accent-secondary)"/><rect x="2.6" y="8.2" width="18.8" height="7.8" rx="2.2" fill="var(--accent-primary)"/><circle cx="18.2" cy="12" r="1.2" fill="#fff"/><rect x="6.8" y="13.6" width="10.4" height="7.8" rx="1.3" fill="var(--accent-warning)"/><rect x="8.6" y="16.2" width="6.8" height="1.3" rx="0.65" fill="#fff"/><rect x="8.6" y="18.5" width="4.4" height="1.3" rx="0.65" fill="#fff"/></svg>
            Run the Press
          </button>
          <p class="press-status" id="press-status"></p>
        </div>

        <!-- Cards print into this tray, one at a time -->
        <div class="press-tray" id="press-tray" aria-hidden="true"></div>
      </div>
    </main>

    <!-- ═══ EDITING ROOM — pick a deck to edit its cards ═══ -->
    <section class="decks-section">
      <div class="press-section-hdr">
        <div class="setup-eyebrow">Editing Room</div>
        <h2>Polish Your Cards</h2>
        <p class="press-section-sub">Fix wording, add images, or regenerate a card before students study it.</p>
      </div>

      <div class="deck-grid" id="edit-deck-grid">
        <p class="deck-empty" id="edit-deck-empty">No decks yet — print your first one above.</p>
      </div>
    </section>

    <!-- ═══ CARD EDITOR OVERLAY ═══ -->
    <div class="review-bd" id="editor-bd" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="review-wrap">
        <div class="review-hdr">
          <span class="review-subject" id="editor-subject"></span>
          <span class="review-progress" id="editor-progress"></span>
          <button class="review-close" id="editor-close" aria-label="Close">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="18" height="18"><rect x="10.6" y="3.5999999999999996" width="2.8" height="16.8" rx="1.4" fill="var(--accent-danger)" transform="rotate(45 12 12)"/><rect x="10.6" y="3.5999999999999996" width="2.8" height="16.8" rx="1.4" fill="var(--accent-danger)" transform="rotate(-45 12 12)"/></svg>
          </button>
        </div>

        <div class="review-stage">
          <div class="card-nav-row">
            <button class="card-nav-arrow" id="editor-prev" type="button" aria-label="Previous card">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="rotate(180 12 12)"><path d="M9.4 3.9 17 11.1a1.25 1.25 0 0 1 0 1.8L9.4 20.1a1.3 1.3 0 0 1-1.8-1.9L14 12 7.6 5.8a1.3 1.3 0 0 1 1.8-1.9z" fill="var(--accent-secondary)"/></g></svg>
            </button>
            <div class="flash-card pp-receipt" id="editor-flash-card">
              <span class="pp-sticky pp-sticky--tape flash-subject" id="editor-flash-subject"></span>
              <span class="pp-sticky pp-sticky--tape flash-note" id="editor-flash-note"></span>
              <div class="flash-card-inner">
                <div class="flash-face flash-front pp-receipt__paper">
                  <div class="flash-blob flash-blob--front" aria-hidden="true"></div>
                  <div class="flash-icon-wrap" id="editor-icon-wrap-front">
                    <span class="flash-icon-tile" aria-hidden="true"></span>
                    <span class="flash-icon" id="editor-icon-front"></span>
                  </div>
                  <div class="flash-photo pp-sticky pp-sticky--tape" id="editor-photo-front" hidden>
                    <img class="flash-image" id="editor-image-front" alt="" />
                  </div>
                  <p class="flash-text" id="editor-front-text"></p>
                  <span class="flash-flip-hint" id="editor-flip-hint" aria-hidden="true"></span>
                </div>
                <div class="flash-face flash-back pp-receipt__paper">
                  <div class="flash-blob flash-blob--back" aria-hidden="true"></div>
                  <div class="flash-icon-wrap" id="editor-icon-wrap-back">
                    <span class="flash-icon-tile" aria-hidden="true"></span>
                    <span class="flash-icon" id="editor-icon-back"></span>
                  </div>
                  <div class="flash-photo pp-sticky pp-sticky--tape" id="editor-photo-back" hidden>
                    <img class="flash-image" id="editor-image-back" alt="" />
                  </div>
                  <p class="flash-text" id="editor-back-text"></p>
                </div>
              </div>
            </div>
            <button class="card-nav-arrow" id="editor-next" type="button" aria-label="Next card">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="rotate(0 12 12)"><path d="M9.4 3.9 17 11.1a1.25 1.25 0 0 1 0 1.8L9.4 20.1a1.3 1.3 0 0 1-1.8-1.9L14 12 7.6 5.8a1.3 1.3 0 0 1 1.8-1.9z" fill="var(--accent-secondary)"/></g></svg>
            </button>
          </div>

          <div class="card-toolbar" id="editor-toolbar">
            <button class="tool-btn" id="editor-tool-edit" type="button" title="Edit text"><span class="tool-icon" id="editor-tool-icon-edit"></span>Edit</button>
            <button class="tool-btn" id="editor-tool-image" type="button" title="Add image"><span class="tool-icon" id="editor-tool-icon-image"></span>Image</button>
            <button class="tool-btn" id="editor-tool-generate" type="button" title="Generate an image with AI"><span class="tool-icon" id="editor-tool-icon-generate"></span>Generate</button>
            <button class="tool-btn" id="editor-tool-copy-prompt" type="button" title="Copy the image prompt to use in an external AI image tool"><span class="tool-icon" id="editor-tool-icon-copy-prompt"></span><span id="editor-tool-copy-prompt-label">Copy Prompt</span></button>
            <button class="tool-btn" id="editor-tool-regen" type="button" title="Regenerate this card"><span class="tool-icon" id="editor-tool-icon-regen"></span>Redo</button>
            <button class="tool-btn tool-btn--danger" id="editor-tool-delete" type="button" title="Delete this card"><span class="tool-icon" id="editor-tool-icon-delete"></span>Delete</button>
            <input type="file" id="editor-tool-image-input" accept="image/*" hidden />
          </div>
        </div>
      </div>
    </div>

    <script src="/utils/components/nav-builder.js" type="module"></script>
    <script type="module" src="./js/main.js"></script>

    <script type="module">
      import { heroPaint } from "/utils/components/nav-icons.js";
      document.querySelectorAll(".builder-paint").forEach((el) => (el.innerHTML = heroPaint()));
    </script>
  </body>
</html>
