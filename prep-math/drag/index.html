<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepPortal | Algebra Lab</title>
  <meta
    name="description"
    content="Solve algebra problems by dragging and balancing terms — an interactive activity that builds equation-solving intuition before an exam."
  />

  <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/logo/logo-light.svg">
  <meta name="theme-color" content="#f4c95d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Shantell+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/utils/components/nav.css">
  <link rel="stylesheet" href="/utils/components/components.css">
  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
    {
      "imports": {
        "firebase/app":      "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
        "firebase/auth":     "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
        "firebase/firestore":"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
        "firebase/storage":  "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
      }
    }
  </script>

  <script src="https://graspablemath.com/shared/libs/gmath/gm-inject.js"></script>
  <script src="/utils/components/loader.js"></script>
    <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
  </head>

<body>

  <div id="loader">
    <div id="loader-wrapper">
      <div class="logo-cluster"></div>
    </div>
    <div class="loader-word"><span>Algebra</span></div>
    <div class="loader-bar"></div>
  </div>

  <nav class="site-nav" data-nav="main"></nav>

  <main class="exam-builder">
    <div class="builder-paint" aria-hidden="true"></div>

    <header class="builder-header">
      <div class="builder-stats" id="builder-stats">
        <div class="hero-stat"><strong id="stat-count">0</strong>&nbsp;Solved</div>
        <div class="hero-stat"><strong id="stat-class" class="stat-topic-val">—</strong>&nbsp;Class</div>
        <div class="hero-stat"><strong id="stat-topic" class="stat-topic-val">—</strong>&nbsp;Topic</div>
      </div>
    </header>

    <div id="status-bar" class="status-bar" role="status" aria-live="polite"></div>

    <div class="builder-receipt pp-receipt">
      <div class="pp-receipt__paper">
        <section class="builder-grid">

          <!-- ── STEP 1 · Class Level ── -->
          <div class="step-card step-card-1 theme-yellow">
            <div class="step-label">
              <span class="step-num">1</span>
              <span class="step-title">Class Level</span>
            </div>
            <div class="filter-eyebrow">Primary School</div>
            <div class="chips-container" id="class-chips-primary">
              <button class="custom-chip class-chip" type="button" data-value="p1">Primary 1</button>
              <button class="custom-chip class-chip" type="button" data-value="p2">Primary 2</button>
              <button class="custom-chip class-chip" type="button" data-value="p3">Primary 3</button>
              <button class="custom-chip class-chip" type="button" data-value="p4">Primary 4</button>
              <button class="custom-chip class-chip" type="button" data-value="p5">Primary 5</button>
              <button class="custom-chip class-chip" type="button" data-value="p6">Primary 6</button>
            </div>
            <div class="filter-eyebrow">Junior Secondary</div>
            <div class="chips-container" id="class-chips-jss">
              <button class="custom-chip class-chip disabled" type="button" data-value="jss1" disabled>JSS 1</button>
              <button class="custom-chip class-chip disabled" type="button" data-value="jss2" disabled>JSS 2</button>
              <button class="custom-chip class-chip disabled" type="button" data-value="jss3" disabled>JSS 3</button>
            </div>
            <div class="filter-eyebrow">Senior Secondary</div>
            <div class="chips-container" id="class-chips-ss">
              <button class="custom-chip class-chip disabled" type="button" data-value="ss1" disabled>SS 1</button>
              <button class="custom-chip class-chip disabled" type="button" data-value="ss2" disabled>SS 2</button>
              <button class="custom-chip class-chip disabled" type="button" data-value="ss3" disabled>SS 3</button>
            </div>
            <p class="step-sub">Select your school level</p>
          </div>

          <!-- ── STEP 2 · Topic ── -->
          <div class="step-card step-card-2 theme-green">
            <div class="step-label">
              <span class="step-num">2</span>
              <span class="step-title">Choose a Topic</span>
            </div>
            <div id="topic-container" class="topic-chips-container">
              <div class="topic-placeholder">Select a class level first</div>
            </div>
            <p class="step-sub">Pick an algebra topic to practise</p>
          </div>

        </section>

        <footer class="builder-footer">
          <span class="setup-status">Mathematics &middot; Algebra Lab</span>
          <button id="gen-btn" class="builder-cta" onclick="generateQuestion()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="16" height="16"><path d="M11 2.4l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z" fill="var(--accent-primary)"/><path d="M18 13.4l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z" fill="var(--accent-danger)"/></svg>
            Generate Equation &rarr;
          </button>
        </footer>
      </div>
    </div>

  </main>

  <!-- ═══ FULLSCREEN OVERLAY ══════════════════════════════════════ -->
  <div id="fs-overlay" class="fs-overlay" style="pointer-events:none;">

    <header class="fs-hdr" id="fs-hdr">
      <button id="fs-new-btn" class="fs-new-btn" onclick="generateQuestion()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="13" height="13"><path d="M19.6 12a7.6 7.6 0 1 1-2.3-5.4" fill="none" stroke="var(--accent-secondary)" stroke-width="3.2" stroke-linecap="round"/><path d="M13.6 7.2l6.4-3.4.4 6.8z" fill="var(--accent-danger)"/></svg>
        New
      </button>
      <button id="fs-canvas-toggle-btn" class="fs-canvas-toggle-btn" onclick="toggleCanvas()" title="Hide canvas">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="13" height="13"><rect x="2.6" y="3.4" width="18.8" height="17.2" rx="2" fill="var(--accent-secondary)"/><path d="M2.6 5.4a2 2 0 0 1 2-2h14.8a2 2 0 0 1 2 2v3.2H2.6z" fill="var(--accent-primary)"/><circle cx="5.6" cy="6" r="1" fill="#fff"/><circle cx="8.4" cy="6" r="1" fill="#fff"/></svg>
        Canvas
      </button>
      <button class="fs-close-btn" onclick="closeOverlay()" aria-label="Close overlay">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="12" height="12"><rect x="10.6" y="3.5999999999999996" width="2.8" height="16.8" rx="1.4" fill="var(--accent-danger)" transform="rotate(45 12 12)"/><rect x="10.6" y="3.5999999999999996" width="2.8" height="16.8" rx="1.4" fill="var(--accent-danger)" transform="rotate(-45 12 12)"/></svg>
      </button>
    </header>

    <div id="fs-canvas-wrap" class="fs-canvas-wrap">
      <div id="gm-fs-canvas"></div>
    </div>

    <footer class="fs-ftr">
      <div class="fs-hint-row">
        <span class="fs-hint-lbl">Hint</span>
        <span id="fs-hint-text" class="fs-hint-txt"></span>
      </div>
      <button id="wp-modal-btn" class="fs-wp-btn" onclick="toggleWordProblemModal()" style="display:none" aria-label="Show problem">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="13" height="13"><path d="M4 4.4a2 2 0 0 1 2-2h8.4L20 8v11.6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="var(--accent-secondary)"/><path d="M14.4 2.4 20 8h-4.4a1.2 1.2 0 0 1-1.2-1.2z" fill="var(--accent-primary)"/><rect x="7.4" y="11.4" width="9" height="1.8" rx="0.9" fill="#fff"/><rect x="7.4" y="15" width="6" height="1.8" rx="0.9" fill="#fff"/></svg>
        Problem
      </button>
      <button id="fs-mark-done-btn" class="fs-wp-btn fs-mark-done-btn" onclick="markExpressionDone()" style="display:none" aria-label="Mark expression done">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="13" height="13"><circle cx="12" cy="12" r="9.6" fill="var(--accent-success)"/><path d="M7.4 12.4l3 3 6.2-6.7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Done
      </button>
      <button class="fs-dismiss-btn" onclick="closeOverlay()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="11" height="11"><rect x="10.6" y="3.5999999999999996" width="2.8" height="16.8" rx="1.4" fill="var(--accent-danger)" transform="rotate(45 12 12)"/><rect x="10.6" y="3.5999999999999996" width="2.8" height="16.8" rx="1.4" fill="var(--accent-danger)" transform="rotate(-45 12 12)"/></svg>
        Close
      </button>
    </footer>

    <!-- ── Word Problem Modal ── -->
    <div id="wp-modal" class="wp-modal" role="dialog" aria-modal="true" aria-labelledby="wp-modal-title">
      <div class="wp-modal-backdrop" onclick="closeWordProblemModal()"></div>
      <div class="wp-modal-card" id="wp-modal-card">
        <div class="wp-hdr">
          <span id="wp-modal-title" class="wp-title">Word Problem</span>
          <button class="wp-hdr-btn wp-hdr-minimize" id="wp-minimize-btn" onclick="minimizeWordProblemModal()" aria-label="Minimize">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="10" height="2"><rect x="4" y="16.6" width="16" height="3.2" rx="1.6" fill="var(--accent-secondary)"/></svg>
          </button>
          <button class="wp-hdr-btn wp-hdr-close" onclick="closeWordProblemModal()" aria-label="Close word problem">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="10" height="10"><rect x="10.6" y="3.5999999999999996" width="2.8" height="16.8" rx="1.4" fill="var(--accent-danger)" transform="rotate(45 12 12)"/><rect x="10.6" y="3.5999999999999996" width="2.8" height="16.8" rx="1.4" fill="var(--accent-danger)" transform="rotate(-45 12 12)"/></svg>
          </button>
        </div>
        <div class="wp-modal-body">
          <p id="wp-modal-text" class="wp-text"></p>
          <p class="wp-modal-hint">Set up the equation in the canvas and solve it.</p>
        </div>
        <div class="wp-modal-foot">
          <button class="wp-modal-solved-btn" onclick="markSolvedFromModal()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="12" height="12"><circle cx="12" cy="12" r="9.6" fill="var(--accent-success)"/><path d="M7.4 12.4l3 3 6.2-6.7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Mark Solved
          </button>
        </div>
      </div>
    </div>

  </div><!-- /fs-overlay -->

  <button id="open-fab" class="open-fab" onclick="openOverlay()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="16" height="16"><rect x="10.5" y="4" width="3" height="16" rx="1.5" fill="var(--accent-success)"/><rect x="4" y="10.5" width="16" height="3" rx="1.5" fill="var(--accent-success)"/></svg>
    Open Canvas
  </button>

  <script type="module" src="/utils/components/nav-builder.js"></script>
  <script type="module" src="../../theory-page/js/keys.js"></script>
  <script type="module" src="./script.js"></script>
  <!-- Layers the one-step-at-a-time sticky-note flow over the class/topic steps. -->
  <script type="module" src="./js/flow.js"></script>
  <script type="module">
    import { heroPaint } from "/utils/components/nav-icons.js";
    document.querySelectorAll(".builder-paint").forEach(el => (el.innerHTML = heroPaint()));
  </script>

</body>

</html>
