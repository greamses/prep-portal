<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pythagoras — Squares on the Sides</title>

    <!-- Page access gate: feature "prep-math-activities", part "pythagoras" -->
    <script type="module" src="/utils/auth/premium-guard.js"></script>
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <meta name="theme-color" content="#f4c95d" />
    <meta
      name="description"
      content="Drag one slider and watch the squares grow on a right triangle, then break apart and slide together to fill the square on the hypotenuse."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="/utils/components/game-tabs.css" />
    <style>
      /* =========================================================
         Pythagoras explorer — the same soft-UI skin as its sibling
         tab, Surface Area, so the two read as one tool. Colour and
         shadow tokens all come from theme.css (via nav.css).
         ========================================================= */
      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--app-bg);
        font-family: var(--font-mono);
        color: var(--ink);
      }

      /* The canvas is painted behind the whole page; the tab bar and the
         banner sit on top of it in normal flow, so they stack instead of
         fighting over a hard-coded offset. */
      #canvas-container {
        position: fixed;
        inset: 0;
        z-index: 1;
      }

      #page-top {
        position: relative;
        z-index: 20;
        pointer-events: none;
      }
      #page-top .builder-tabs { pointer-events: auto; }

      /* Soft floating panel base (rounded sticker card, soft shadow). */
      .neo-box {
        background: var(--surface-primary);
        border: 2px solid color-mix(in srgb, var(--ink) 10%, transparent);
        border-radius: 20px;
        box-shadow: var(--shadow-lg);
      }

      /* Explanation banner. */
      #explanation-overlay {
        margin: 12px auto 0;
        padding: 14px 26px;
        text-align: center;
        width: min(85%, 640px);
        box-sizing: border-box;
        transition: opacity 0.3s;
      }
      #explanation-overlay p {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(0.86rem, 2.1vw, 1.05rem);
        line-height: 1.45;
        font-weight: var(--weight-bold);
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      #explanation-overlay .step-tag {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 5px;
      }

      /* Floating figure labels — soft pills (colour set inline by JS). */
      #labels-container {
        position: fixed;
        inset: 0;
        z-index: 15;
        pointer-events: none;
      }
      .float-label {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 3px 9px;
        border-radius: 999px;
        font-family: var(--font-mono);
        font-size: 0.74rem;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
        box-shadow: var(--shadow-sm);
        transition: opacity 0.25s;
      }

      /* Bottom bar: play/replay + the slider that drives the whole proof. */
      #controls {
        position: fixed;
        bottom: 4%;
        left: 50%;
        transform: translateX(-50%);
        width: min(88%, 640px);
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 20px;
        box-sizing: border-box;
      }
      .slider-label {
        font-family: var(--font-display);
        font-size: 0.78rem;
        font-weight: var(--weight-bold);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      /* Soft pill range slider. */
      input[type="range"] {
        flex-grow: 1;
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        background: color-mix(in srgb, var(--ink) 12%, transparent);
        border-radius: 999px;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        height: 24px;
        width: 24px;
        background: var(--accent-secondary);
        border: 3px solid var(--surface-primary);
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        border-radius: 50%;
        transition: transform 0.12s ease;
      }
      input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
      input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.02); }
      input[type="range"]::-moz-range-thumb {
        height: 24px;
        width: 24px;
        background: var(--accent-secondary);
        border: 3px solid var(--surface-primary);
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        border-radius: 50%;
      }

      /* Round icon buttons — play, replay, settings. */
      .round-btn {
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 2px solid color-mix(in srgb, var(--ink) 12%, transparent);
        border-radius: 50%;
        background: var(--surface-primary);
        color: var(--ink);
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: transform 0.14s ease, background 0.14s ease, color 0.14s ease;
      }
      .round-btn:hover { transform: translateY(-2px); }
      .round-btn.active {
        background: var(--accent-secondary);
        color: var(--text-on-accent, #1a1a1a);
      }
      .round-btn svg { width: 17px; height: 17px; }
      .round-btn .icon-pause { display: none; }
      .round-btn.is-playing .icon-play { display: none; }
      .round-btn.is-playing .icon-pause { display: block; }

      #top-buttons {
        position: fixed;
        top: 88px;
        right: 18px;
        z-index: 25;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      /* Settings sheet. */
      #modal-backdrop {
        position: fixed;
        inset: 0;
        background: color-mix(in srgb, var(--ink) 42%, transparent);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s;
      }
      #modal-backdrop.open { opacity: 1; pointer-events: auto; }

      #settings-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -46%) scale(0.96);
        width: min(90%, 380px);
        padding: 22px 24px 24px;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s, transform 0.22s;
      }
      #settings-modal.open {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%) scale(1);
      }
      #settings-modal h2 {
        margin: 0 0 16px;
        font-family: var(--font-display);
        font-size: 1rem;
        letter-spacing: -0.01em;
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .setting-row .leg-value {
        font-family: var(--font-mono);
        font-weight: 700;
        color: var(--ink);
        min-width: 2.4em;
        text-align: right;
      }
      .setting-row input[type="range"] { max-width: 170px; }

      .neo-switch { position: relative; width: 46px; height: 25px; flex-shrink: 0; }
      .neo-switch input { opacity: 0; width: 0; height: 0; }
      .neo-slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        background: color-mix(in srgb, var(--ink) 16%, transparent);
        border-radius: 999px;
        transition: background 0.2s;
      }
      .neo-slider:before {
        content: "";
        position: absolute;
        height: 19px;
        width: 19px;
        left: 3px;
        bottom: 3px;
        background: var(--surface-primary);
        border-radius: 50%;
        box-shadow: var(--shadow-sm);
        transition: transform 0.2s;
      }
      .neo-switch input:checked + .neo-slider { background: var(--accent-success); }
      .neo-switch input:checked + .neo-slider:before { transform: translateX(21px); }

      .btn-action {
        margin-top: 18px;
        padding: 11px;
        text-align: center;
        border-radius: 14px;
        background: var(--accent-secondary);
        color: var(--text-on-accent, #1a1a1a);
        font-family: var(--font-display);
        font-weight: var(--weight-bold);
        font-size: 0.82rem;
        cursor: pointer;
        user-select: none;
      }

      /* The triple that makes the numbers come out whole. */
      .triple-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: -4px 0 16px;
      }
      .triple-chip {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 999px;
        border: 2px solid color-mix(in srgb, var(--ink) 12%, transparent);
        background: var(--surface-primary);
        color: var(--text-secondary);
        cursor: pointer;
      }
      .triple-chip:hover { color: var(--ink); }

      @media (max-width: 640px) {
        #controls { bottom: 2.5%; gap: 10px; padding: 11px 14px; }
        .slider-label { font-size: 0.7rem; }
        #explanation-overlay { padding: 11px 16px; }
        /* The tab bar wraps onto two rows on a phone and runs under a cluster
           pinned to the top-right, so the buttons move down beside the figure
           instead, just clear of the slider bar. */
        #top-buttons {
          top: auto;
          bottom: 96px;
          right: 12px;
          flex-direction: row;
        }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js",
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
  </head>

  <body>
    <div id="loader">
      <div id="loader-wrapper">
        <div class="logo-cluster"></div>
      </div>
      <div class="loader-word"><span>Pythagoras</span></div>
      <div class="loader-bar"></div>
    </div>

    <script type="module" src="/utils/auth/login-guard.js"></script>
    <nav class="site-nav" data-nav="main"></nav>

    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <div id="page-top">
      <div class="builder-tabs builder-tabs--float" data-tabs="geometry"></div>

      <div id="explanation-overlay" class="neo-box">
        <span class="step-tag" id="step-tag">Step 1 of 7</span>
        <p id="text-content">Building the figure…</p>
      </div>
    </div>

    <div id="top-buttons">
      <button id="settings-btn" class="round-btn" title="Open settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="reset-view-btn" class="round-btn" title="Straighten the view" aria-label="Straighten the view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>

    <!-- Settings sheet -->
    <div id="modal-backdrop"></div>
    <div id="settings-modal" class="neo-box">
      <h2>The triangle</h2>

      <div class="triple-row" id="triple-row"></div>

      <div class="setting-row">
        <label for="leg-a">Leg <em>a</em></label>
        <input type="range" id="leg-a" min="1" max="6" step="0.5" value="3" />
        <span class="leg-value" id="leg-a-val">3</span>
      </div>
      <div class="setting-row">
        <label for="leg-b">Leg <em>b</em></label>
        <input type="range" id="leg-b" min="1" max="6" step="0.5" value="4" />
        <span class="leg-value" id="leg-b-val">4</span>
      </div>

      <div class="setting-row">
        <label>Show labels</label>
        <label class="neo-switch">
          <input type="checkbox" id="toggle-labels" checked />
          <span class="neo-slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <label>Explanations</label>
        <label class="neo-switch">
          <input type="checkbox" id="toggle-explanation" checked />
          <span class="neo-slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <label>Multicolour</label>
        <label class="neo-switch">
          <input type="checkbox" id="toggle-colors" checked />
          <span class="neo-slider"></span>
        </label>
      </div>

      <div class="btn-action" id="close-settings">Apply / Close</div>
    </div>

    <div id="controls" class="neo-box">
      <button id="play-btn" class="round-btn" title="Play the proof" aria-label="Play the proof">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
      </button>
      <span class="slider-label">a² + b²</span>
      <input type="range" id="progress-slider" min="0" max="100" step="0.1" value="0"
             aria-label="Proof progress" />
      <span class="slider-label">c²</span>
    </div>

    <script src="/utils/components/loader.js"></script>
    <script type="module" src="/utils/components/nav-builder.js"></script>
    <script type="module" src="/utils/components/geometry-tabs.js"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
