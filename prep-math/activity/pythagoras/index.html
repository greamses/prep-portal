<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pythagoras — Squares on the Sides</title>

    <!-- Page access gate: feature "prep-math-activities", part "pythagoras" -->
    <script type="module" src="/utils/auth/premium-guard.js"></script>
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <meta name="theme-color" content="#f4c95d" />
    <meta
      name="description"
      content="Drag the triangle to any size, then drag one slider and watch the squares grow on its sides, break apart and slide together to fill the square on the hypotenuse."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="/utils/components/setup.css" />
    <link rel="stylesheet" href="/utils/components/game-tabs.css" />
    <style>
      /* =========================================================
         Pythagoras studio.
         Everything here is layout for this page only — the paper,
         the notes and the torn receipts come from components.css
         and setup.css, and every colour is a theme.css token.
         ========================================================= */
      body {
        margin: 0;
        overflow: hidden;
        background: var(--app-bg);
        font-family: var(--font-mono);
        color: var(--ink);
      }

      /* The canvas is transparent and painted behind the whole page, so the
         site's paint-blob wash (injected into <body> by nav-builder) still
         shows through the figure. The tab bar and the note stack above it in
         normal flow, so neither has to know how tall the other is. */
      #canvas-container {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      /* The wash sits at its usual strength behind ordinary page content; here
         it is behind a figure that has to be read, so it drops back. */
      .pp-page-paint { opacity: 0.15; }
      [data-theme="dark"] .pp-page-paint { opacity: 0.1; }

      #page-top {
        position: relative;
        z-index: 20;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #page-top .builder-tabs { pointer-events: auto; }

      /* ── The commentary is a sticky note, like every other aside on the
         site. It is wide, so it barely tilts. ────────────────────────────── */
      #explanation-overlay {
        margin: 14px auto 0;
        padding: 0.85rem 1.4rem 0.95rem;
        width: min(88%, 620px);
        box-sizing: border-box;
        text-align: center;
        --pp-note-tilt: -0.5deg;
        transition: opacity var(--transition-base, 0.3s);
      }
      #explanation-overlay p {
        margin: 0;
        font-size: 0.95rem;
        line-height: var(--leading-snug, 1.45);
        font-weight: 600;
      }
      #explanation-overlay em { font-style: italic; }
      #explanation-overlay .step-tag {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: var(--tracking-wider, 0.14em);
        text-transform: uppercase;
        opacity: 0.55;
        margin-bottom: 4px;
      }

      /* ── Figure labels: the shared pill, tinted per tile. ──────────────── */
      #labels-container {
        position: fixed;
        inset: 0;
        z-index: 15;
        pointer-events: none;
      }
      .float-label {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 0.25rem 0.6rem;
        border-radius: 2px;
        border: var(--border, 2px solid #2a2723);
        background: var(--surface-primary);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        box-shadow: var(--shadow-sm);
        transition: opacity var(--transition-base, 0.25s);
      }
      /* the tile's own colour as a stripe down the side, so a label is tied to
         its square without printing text on a saturated fill */
      .float-label::before {
        content: "";
        position: absolute;
        left: -2px;
        top: -2px;
        bottom: -2px;
        width: 5px;
        background: var(--tile, var(--accent-secondary));
      }

      /* ── The slider strip is a torn receipt. ───────────────────────────── */
      #controls {
        position: fixed;
        bottom: max(3%, env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        width: min(90%, 620px);
        z-index: 20;
      }
      #controls .pp-receipt__paper {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 1rem 1.5rem 1.05rem;
      }
      .slider-label {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: var(--tracking-wide, 0.05em);
        color: var(--text-secondary);
        white-space: nowrap;
      }

      /* Range input — square-ended track, paper thumb with the site's border. */
      input[type="range"] {
        flex-grow: 1;
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        background: var(--surface-secondary);
        border: var(--border-subtle);
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        height: 22px;
        width: 22px;
        background: var(--accent-primary);
        border: var(--border, 2px solid #2a2723);
        border-radius: 2px;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: transform var(--transition-base, 0.14s);
      }
      input[type="range"]::-webkit-slider-thumb:hover { transform: translateY(-1px) scale(1.06); }
      input[type="range"]::-moz-range-thumb {
        height: 22px;
        width: 22px;
        background: var(--accent-primary);
        border: var(--border, 2px solid #2a2723);
        border-radius: 2px;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
      }

      /* Square icon button on .pp-btn. sticky-ui.css turns every .pp-btn into a
         sticky note, which is right for a button with a label on it — but the
         tape and the tilt are clutter at 38px, and the tape on the play button
         would be cropped by the receipt's torn-paper mask. Same exemption
         sticky-ui already makes for icon-only close buttons. */
      .pp-btn.icon-btn {
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        padding: 0;
        transform: none;
        background: var(--pp-note-bg, #fff3a8);
      }
      .pp-btn.icon-btn::before { display: none; }
      .pp-btn.icon-btn:hover { transform: translateY(-2px); }
      .pp-btn.icon-btn:active { transform: translateY(0); }
      .icon-btn--key { --pp-note-bg: var(--accent-primary); }
      .icon-btn svg { width: 17px; height: 17px; }
      .icon-btn .icon-pause { display: none; }
      .icon-btn.is-playing .icon-play { display: none; }
      .icon-btn.is-playing .icon-pause { display: block; }

      #top-buttons {
        position: fixed;
        top: 92px;
        right: 18px;
        z-index: 25;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      /* ── Settings: the shared setup receipt, as a sheet. ───────────────── */
      #modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(var(--shadow-color, 42, 39, 35), 0.45);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--transition-base, 0.22s);
      }
      #modal-backdrop.open { opacity: 1; pointer-events: auto; }

      #settings-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -46%);
        width: min(92%, 380px);
        max-height: 82vh;
        overflow-y: auto;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--transition-base, 0.22s),
          transform var(--transition-bounce, 0.4s cubic-bezier(0.16, 1, 0.3, 1));
      }
      #settings-modal.open {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      #settings-modal .pp-setup__paper { gap: 1.3rem; }
      .leg-row {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }
      .leg-row .leg-value {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 0.82rem;
        color: var(--ink);
        min-width: 2.2em;
        text-align: right;
      }
      /* A full-width note barely leans — the tilt is a wink, not a shrug. */
      #settings-modal .pp-btn { width: 100%; margin-top: 0.2rem; --pp-note-tilt: -0.7deg; }
      /* Green, to pair with the verdict note that summons it. */
      #tri-draw { --pp-note-bg: #c8f0c0; }

      /* ── Triple checker: three lengths and a verdict on paper. ────────── */
      .tri-check {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .tri-check .pp-setup-input {
        flex: 1 1 0;
        width: auto;
        min-width: 0;
        /* Right-aligned so the digits end hard against their own ², rather than
           floating in the middle of the box away from it. */
        padding: 0.45rem 0.15rem 0.45rem 0.3rem;
        text-align: right;
        /* No spinner: the arrows crowd a 3-character box and this is a thing
           you type, not a thing you nudge. */
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .tri-check .pp-setup-input::-webkit-outer-spin-button,
      .tri-check .pp-setup-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .tri-op {
        font-family: var(--font-mono);
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .pp-sticky.tri-verdict {
        display: block;
        margin: 0.2rem 0 0;
        font-size: 0.78rem;
        line-height: 1.4;
        padding: 0.5rem 0.75rem 0.55rem;
        --pp-note-tilt: -0.8deg;
      }

      /* Triple presets are notes you can pick up. */
      .triple-row { display: flex; flex-wrap: wrap; gap: 0.8rem 0.55rem; }
      .pp-sticky.triple-chip {
        font-size: 0.74rem;
        padding: 0.35rem 0.7rem 0.4rem;
        cursor: pointer;
        border: 0;
      }
      .triple-chip:hover { transform: rotate(0deg) scale(1.06); }

      /* ── A one-off hint, dismissed for good once the triangle is dragged. */
      #drag-hint {
        position: fixed;
        left: 50%;
        transform: translateX(-50%) rotate(var(--pp-note-tilt, 1.5deg));
        bottom: calc(3% + 86px);
        z-index: 22;
        font-size: 0.76rem;
        padding: 0.4rem 0.85rem 0.45rem;
        pointer-events: none;
        transition: opacity var(--transition-base, 0.3s);
      }
      #drag-hint.gone { opacity: 0; }

      @media (max-width: 640px) {
        #controls { bottom: 2.5%; width: 94%; }
        #controls .pp-receipt__paper { gap: 0.6rem; padding: 0.85rem 1.1rem 0.9rem; }
        .slider-label { font-size: 0.64rem; }
        #explanation-overlay { padding: 0.7rem 1rem 0.8rem; }
        #explanation-overlay p { font-size: 0.86rem; }
        /* The tab bar wraps onto two rows on a phone and would run under a
           cluster pinned top-right, so the buttons move down beside the
           figure instead, just clear of the slider strip. */
        #top-buttons {
          top: auto;
          bottom: 104px;
          right: 12px;
          flex-direction: row;
        }
        #drag-hint { bottom: calc(2.5% + 92px); }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js",
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
  </head>

  <body>
    <div id="loader">
      <div id="loader-wrapper">
        <div class="logo-cluster"></div>
      </div>
      <div class="loader-word"><span>Pythagoras</span></div>
      <div class="loader-bar"></div>
    </div>

    <script type="module" src="/utils/auth/login-guard.js"></script>
    <nav class="site-nav" data-nav="main"></nav>

    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <div id="page-top">
      <!-- One nav link, four studios: the bar is filled by geometry-tabs.js -->
      <div class="builder-tabs builder-tabs--float" data-tabs="geometry"></div>

      <div id="explanation-overlay" class="pp-sticky pp-sticky--c0 pp-sticky--tape">
        <span class="step-tag" id="step-tag">Step 1 of 7</span>
        <p id="text-content">Building the figure…</p>
      </div>
    </div>

    <span id="drag-hint" class="pp-sticky pp-sticky--c3">Drag either corner to resize the triangle</span>

    <div id="top-buttons">
      <button id="settings-btn" class="pp-btn icon-btn" title="The triangle" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="reset-view-btn" class="pp-btn icon-btn" title="Straighten the view" aria-label="Straighten the view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>

    <!-- Settings sheet — the shared setup receipt -->
    <div id="modal-backdrop"></div>
    <div id="settings-modal" class="pp-receipt pp-setup__receipt">
      <div class="pp-receipt__paper pp-setup__paper">
        <h2 class="pp-setup__title">The triangle</h2>

        <div class="pp-setup-field">
          <span>Ready-made triples</span>
          <div class="triple-row" id="triple-row"></div>
        </div>

        <div class="pp-setup-field">
          <span>Legs</span>
          <div class="leg-row">
            <label class="slider-label" for="leg-a">a</label>
            <input type="range" id="leg-a" min="1" max="8" step="1" value="3" />
            <span class="leg-value" id="leg-a-val">3</span>
          </div>
          <div class="leg-row">
            <label class="slider-label" for="leg-b">b</label>
            <input type="range" id="leg-b" min="1" max="8" step="1" value="4" />
            <span class="leg-value" id="leg-b-val">4</span>
          </div>
        </div>

        <div class="pp-setup-field">
          <span>Is it a triple?</span>
          <div class="tri-check">
            <input class="pp-setup-input" id="tri-a" type="number" min="0" step="any"
                   inputmode="decimal" placeholder="a" aria-label="First leg" />
            <span class="tri-op">² +</span>
            <input class="pp-setup-input" id="tri-b" type="number" min="0" step="any"
                   inputmode="decimal" placeholder="b" aria-label="Second leg" />
            <span class="tri-op">² =</span>
            <input class="pp-setup-input" id="tri-c" type="number" min="0" step="any"
                   inputmode="decimal" placeholder="c" aria-label="Hypotenuse" />
            <span class="tri-op">²</span>
          </div>
          <p class="pp-sticky tri-verdict" id="tri-verdict" role="status">
            Put three lengths in — the longest one last.
          </p>
          <button type="button" class="pp-btn" id="tri-draw" hidden>Draw this one</button>
        </div>

        <div class="pp-setup-field">
          <span>Show</span>
          <div class="sticky-row">
            <label class="pp-sticky sticky-choice pp-sticky--c0">
              <input type="checkbox" id="toggle-labels" checked /> Labels
            </label>
            <label class="pp-sticky sticky-choice pp-sticky--c1">
              <input type="checkbox" id="toggle-explanation" checked /> Commentary
            </label>
            <label class="pp-sticky sticky-choice pp-sticky--c2">
              <input type="checkbox" id="toggle-colors" checked /> Colour
            </label>
          </div>
        </div>

        <button type="button" class="pp-btn" id="close-settings">Done</button>
      </div>
    </div>

    <div id="controls" class="pp-receipt">
      <div class="pp-receipt__paper">
        <button id="play-btn" class="pp-btn icon-btn icon-btn--key" title="Play the proof" aria-label="Play the proof">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>
        <span class="slider-label">a² + b²</span>
        <input type="range" id="progress-slider" min="0" max="100" step="0.1" value="0"
               aria-label="Proof progress" />
        <span class="slider-label">c²</span>
      </div>
    </div>

    <script src="/utils/components/loader.js"></script>
    <script type="module" src="/utils/components/nav-builder.js"></script>
    <script type="module" src="/utils/components/geometry-tabs.js"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
