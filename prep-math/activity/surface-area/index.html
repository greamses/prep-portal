<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surface Area — 3D to 2D Nets</title>

    <!-- Page access gate: feature "prep-math-activities", part "surface-area" -->
    <script type="module" src="/utils/auth/premium-guard.js"></script>
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <meta name="theme-color" content="#f4c95d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="/utils/components/setup.css" />
    <link rel="stylesheet" href="/utils/components/game-tabs.css" />
    <style>
      /* =========================================================
         Surface Area studio — the same clothes as its sibling tab,
         Pythagoras. The paper, the notes and the torn receipts all
         come from components.css / setup.css; nothing here is a
         card of its own, and every colour is a theme.css token.
         ========================================================= */
      body {
        margin: 0;
        overflow: hidden;
        background: var(--app-bg);
        font-family: var(--font-mono);
        color: var(--ink);
      }

      /* Transparent canvas behind the whole page, so the site's paint-blob
         wash still shows through the shape. */
      #canvas-container {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      .pp-page-paint { opacity: 0.15; }
      [data-theme="dark"] .pp-page-paint { opacity: 0.1; }

      /* Tab bar + banner ride above the canvas in normal flow, so neither one
         needs to know how tall the other is. */
      #page-top {
        position: relative;
        z-index: 20;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #page-top .builder-tabs { pointer-events: auto; }

      /* ── The commentary is a sticky note. It is wide, so it barely tilts. */
      #explanation-overlay {
        margin: 14px auto 0;
        padding: 0.85rem 1.4rem 0.95rem;
        width: min(88%, 620px);
        box-sizing: border-box;
        text-align: center;
        --pp-note-tilt: -0.5deg;
        transition: opacity var(--transition-base, 0.3s);
      }
      #explanation-overlay p {
        margin: 0;
        font-size: 0.95rem;
        line-height: var(--leading-snug, 1.45);
        font-weight: 600;
      }

      /* ── Face labels: paper, with the face's own colour as a stripe down
         the side, rather than text printed on a saturated fill. ─────────── */
      #labels-container {
        position: fixed;
        inset: 0;
        z-index: 15;
        pointer-events: none;
      }
      .floating-label {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 0.25rem 0.6rem;
        border-radius: 2px;
        border: var(--border, 2px solid #2a2723);
        background: var(--surface-primary);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        box-shadow: var(--shadow-sm);
        opacity: 0;
        transition: opacity var(--transition-base, 0.25s);
      }
      .floating-label::before {
        content: "";
        position: absolute;
        left: -2px;
        top: -2px;
        bottom: -2px;
        width: 5px;
        background: var(--tile, var(--accent-secondary));
      }

      /* ── The slider strip is a torn receipt. ───────────────────────────── */
      #controls {
        position: fixed;
        bottom: max(3%, env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        width: min(90%, 620px);
        z-index: 20;
      }
      #controls .pp-receipt__paper {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 1rem 1.5rem 1.05rem;
      }
      .slider-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: var(--tracking-wide, 0.05em);
        color: var(--text-secondary);
        white-space: nowrap;
      }

      /* Range input — square-ended track, paper thumb with the site's border. */
      input[type="range"] {
        flex-grow: 1;
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        background: var(--surface-secondary);
        border: var(--border-subtle);
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        height: 22px;
        width: 22px;
        background: var(--accent-primary);
        border: var(--border, 2px solid #2a2723);
        border-radius: 2px;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: transform var(--transition-base, 0.14s);
      }
      input[type="range"]::-webkit-slider-thumb:hover { transform: translateY(-1px) scale(1.06); }
      input[type="range"]::-moz-range-thumb {
        height: 22px;
        width: 22px;
        background: var(--accent-primary);
        border: var(--border, 2px solid #2a2723);
        border-radius: 2px;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
      }

      /* Square icon button on .pp-btn. sticky-ui.css turns every .pp-btn into
         a taped note, which is clutter at 38px and gets cropped by a receipt's
         mask — the same exemption sticky-ui makes for icon-only buttons. */
      .pp-btn.icon-btn {
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        padding: 0;
        transform: none;
        background: var(--pp-note-bg, #fff3a8);
      }
      .pp-btn.icon-btn::before { display: none; }
      .pp-btn.icon-btn:hover { transform: translateY(-2px); }
      .pp-btn.icon-btn:active { transform: translateY(0); }
      .icon-btn svg { width: 17px; height: 17px; }
      #rotate-btn.active { --pp-note-bg: #c8f0c0; }
      #rotate-btn.active svg { animation: spin-slow 3s linear infinite; }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      #top-buttons {
        position: fixed;
        top: 92px;
        right: 18px;
        z-index: 25;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      /* ── Sheets: the shared setup receipt. ─────────────────────────────── */
      #modal-backdrop,
      #alert-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(var(--shadow-color, 42, 39, 35), 0.45);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--transition-base, 0.22s);
      }
      #modal-backdrop.open,
      #alert-backdrop.open { opacity: 1; pointer-events: auto; }

      /* Compounded with .pp-receipt on purpose: loader.js injects components.css
         late, so at an equal-specificity tie .pp-receipt's own `position:
         relative` beats a bare .modal-box and the sheet drifts out of the
         viewport. setup.css carries the same note for .sticky-choice. */
      .modal-box.pp-receipt {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -46%);
        width: min(92%, 400px);
        margin: 0;
        max-height: 82vh;
        overflow-y: auto;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--transition-base, 0.22s),
          transform var(--transition-bounce, 0.4s cubic-bezier(0.16, 1, 0.3, 1));
      }
      .modal-box.pp-receipt.open {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      .modal-box .pp-setup__paper { gap: 1.3rem; }
      .modal-box .pp-btn { width: 100%; margin-top: 0.2rem; --pp-note-tilt: -0.7deg; }

      #custom-alert .pp-receipt__paper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
        text-align: center;
      }
      #custom-alert svg { width: 40px; height: 40px; stroke: var(--accent-secondary); }
      #custom-alert p {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--ink);
      }

      @media (max-width: 640px) {
        #controls { bottom: 2.5%; width: 94%; }
        #controls .pp-receipt__paper { gap: 0.6rem; padding: 0.85rem 1.1rem 0.9rem; }
        .slider-label { font-size: 0.64rem; }
        #explanation-overlay { padding: 0.7rem 1rem 0.8rem; }
        #explanation-overlay p { font-size: 0.86rem; }
        /* The tab bar wraps onto two rows on a phone, so the cluster moves
           down beside the shape rather than under the notes. */
        #top-buttons {
          top: auto;
          bottom: 104px;
          right: 12px;
          flex-direction: row;
        }
      }
    </style>
      <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
  </head>

  <body>
    <div id="loader">
      <div id="loader-wrapper">
        <div class="logo-cluster"></div>
        <!-- JS will inject the 3 images here -->
      </div>
      <div class="loader-word"><span>Surface Area</span></div>
      <div class="loader-bar"></div>
    </div>

    <script type="module" src="/utils/auth/login-guard.js"></script>
    <nav class="site-nav" data-nav="main"></nav>

    <div id="labels-container"></div>

    <div id="page-top">
      <!-- One nav link, four studios: the bar is filled by geometry-tabs.js -->
      <div class="builder-tabs builder-tabs--float" data-tabs="geometry"></div>

      <div id="explanation-overlay" class="pp-sticky pp-sticky--c0 pp-sticky--tape">
        <p id="text-content">Unfolding the shape…</p>
      </div>
    </div>

    <!-- Grouped top-right buttons -->
    <div id="top-buttons">
      <!-- Rotation toggle — ON by default -->
      <button id="rotate-btn" class="pp-btn icon-btn active" title="Auto-rotation ON — click to stop"
              aria-label="Toggle auto-rotation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>

      <button id="settings-btn" class="pp-btn icon-btn" title="The shape" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <!-- Settings sheet — the shared setup receipt -->
    <div id="modal-backdrop"></div>
    <div id="settings-modal" class="modal-box pp-receipt pp-setup__receipt">
      <div class="pp-receipt__paper pp-setup__paper">
        <h2 class="pp-setup__title">The shape</h2>

        <div class="pp-setup-field">
          <span>Solid</span>
          <div class="sticky-row" id="shape-options">
            <label class="pp-sticky sticky-choice pp-sticky--c0">
              <input type="radio" name="shape" value="sphere" checked /> Sphere
            </label>
            <label class="pp-sticky sticky-choice pp-sticky--c1">
              <input type="radio" name="shape" value="cone" /> Cone
            </label>
            <label class="pp-sticky sticky-choice pp-sticky--c2">
              <input type="radio" name="shape" value="cylinder" /> Cylinder
            </label>
            <label class="pp-sticky sticky-choice pp-sticky--c3">
              <input type="radio" name="shape" value="cube" /> Cube
            </label>
            <label class="pp-sticky sticky-choice pp-sticky--c4">
              <input type="radio" name="shape" value="cuboid" /> Cuboid
            </label>
          </div>
        </div>

        <div class="pp-setup-field">
          <span>Show</span>
          <div class="sticky-row">
            <label class="pp-sticky sticky-choice pp-sticky--c0">
              <input type="checkbox" id="toggle-labels" checked /> Area labels
            </label>
            <label class="pp-sticky sticky-choice pp-sticky--c1">
              <input type="checkbox" id="toggle-explanation" checked /> Commentary
            </label>
            <label class="pp-sticky sticky-choice pp-sticky--c2">
              <input type="checkbox" id="toggle-colors" checked /> Colour
            </label>
          </div>
        </div>

        <button type="button" class="pp-btn" id="close-settings">Done</button>
      </div>
    </div>

    <!-- Alert sheet -->
    <div id="alert-backdrop"></div>
    <div id="custom-alert" class="modal-box pp-receipt">
      <div class="pp-receipt__paper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <p id="custom-alert-text">Alert message</p>
        <button type="button" class="pp-btn" id="close-alert">OK</button>
      </div>
    </div>

    <div id="canvas-container"></div>

    <div id="controls" class="pp-receipt">
      <div class="pp-receipt__paper">
        <span class="slider-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          </svg>
          Solid
        </span>
        <input type="range" id="progress-slider" min="0" max="100" value="0"
               aria-label="Unfolding progress" />
        <span class="slider-label">
          Net
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="1"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </span>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js",
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm"
        }
      }
    </script>

    <script src="/utils/components/loader.js"></script>
    <script type="module" src="/utils/components/nav-builder.js"></script>
    <script type="module" src="/utils/components/geometry-tabs.js"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
