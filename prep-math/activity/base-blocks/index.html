<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo/logo-light.svg" />
    <meta name="theme-color" content="#f4c95d" />
    <title>Prep Portal | Manipulatives</title>
    <meta
      name="description"
      content="A workbench of maths manipulatives in 3D: base-ten blocks you can split and trade in any base, Russian, Chinese and Japanese abacuses, and place-value, multiplication and division charts — all on one endless sheet of squared paper."
    />

    <!-- Page access gate: feature "prep-math-activities", part "base-blocks" -->
    <script type="module" src="/utils/auth/premium-guard.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="/utils/components/game-viewport.css" />
    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
        }
      }
    </script>

    <script src="/utils/components/loader.js"></script>
  </head>

  <body>
    <div id="loader">
      <div id="loader-wrapper">
        <div class="logo-cluster"></div>
      </div>
      <div class="loader-word"><span>Blocks</span></div>
      <div class="loader-bar"></div>
    </div>

    <script type="module" src="/utils/auth/login-guard.js"></script>
    <nav class="site-nav" data-nav="main"></nav>

    <div class="bb-paint" aria-hidden="true"></div>

    <main class="bb-page">
      <!-- ═══ HERO ═══ -->
      <header class="bb-hero">
        <span class="bb-eyebrow bb-eyebrow--note">
          <span data-icon="base"></span>
          Mathematics · Things to think with
        </span>

        <h1 class="bb-title">Manipulatives<em>.</em></h1>

        <p class="bb-lead">
          An endless sheet of squared paper and a shelf of things to put on it.
          Pick one to open the canvas.
        </p>
      </header>

      <!-- ═══ THE SHELF (built from js/tools.js) ═══ -->
      <section class="bb-shelf" id="bb-shelf" aria-label="Choose a manipulative"></section>

    </main>

    <!-- ═══ THE CANVAS (opens over everything) ═══ -->
    <div class="bb-canvas-view" id="bb-canvas-view" hidden>
      <div class="bb-frame">
        <div class="bb-stage" data-game-stage>
          <canvas id="bb-canvas" touch-action="none"></canvas>
          <div class="bb-marquee" id="bb-marquee" hidden></div>

          <!-- ── running total + base ─────────────────────────────────── -->
          <div class="bb-top">
            <button class="bb-chip bb-chip--back" id="bb-back" type="button">
              <span data-icon="back"></span>
              <span>Shelf</span>
            </button>
            <div class="bb-count">
              <b id="bb-count-n">0</b>
              <span id="bb-count-sub">units on the canvas</span>
            </div>
            <div class="bb-top__right">
              <button class="bb-chip" id="bb-view-btn" type="button" aria-pressed="false">
                <span data-icon="flat"></span>
                <span id="bb-view-label">2D</span>
              </button>
              <button
                class="bb-chip"
                id="bb-base-btn"
                type="button"
                aria-haspopup="dialog"
                aria-expanded="false"
              >
                <span data-icon="base"></span>
                <span id="bb-base-label">Base ten</span>
              </button>
              <button
                class="bb-chip"
                id="bb-board-btn"
                type="button"
                aria-expanded="false"
                aria-controls="bb-board"
              >
                <span data-icon="rows"></span>
                <span>Place value</span>
              </button>
            </div>
          </div>

          <!-- ── tools ────────────────────────────────────────────────── -->
          <div class="bb-rail" role="toolbar" aria-label="Tools">
            <button class="bb-tool" type="button" data-act="regroup"
                    aria-label="Regroup the picked blocks into the best grouping for this base (R)"
                    title="Regroup — best grouping for this base (R)">
              <span data-icon="regroup"></span><em>Regroup</em>
            </button>
            <button class="bb-tool" type="button" data-act="split"
                    aria-label="Split the picked blocks (S)" title="Split (S)">
              <span data-icon="split"></span><em>Split</em>
            </button>
            <button class="bb-tool" type="button" data-act="merge"
                    aria-label="Merge the picked blocks (M)" title="Merge (M)">
              <span data-icon="merge"></span><em>Merge</em>
            </button>
            <button class="bb-tool" type="button" data-act="break"
                    aria-label="Break the picked blocks into unit cubes (B)" title="Break to units (B)">
              <span data-icon="crumbs"></span><em>To units</em>
            </button>
            <button class="bb-tool" type="button" data-act="match"
                    aria-label="Pick every block the same size as this one" title="Match every block this size">
              <span data-icon="match"></span><em>Match</em>
            </button>
            <button class="bb-tool" type="button" data-act="lasso" aria-pressed="false"
                    aria-label="Box pick: drag on the paper to sweep up blocks" title="Box pick">
              <span data-icon="lasso"></span><em>Box pick</em>
            </button>
            <button class="bb-tool" type="button" data-act="tidy"
                    aria-label="Tidy the canvas into rows (T)" title="Tidy up (T)">
              <span data-icon="rows"></span><em>Tidy</em>
            </button>
            <button class="bb-tool" type="button" data-act="undo"
                    aria-label="Undo the last change (Ctrl+Z)" title="Undo (Ctrl+Z)">
              <span data-icon="undo"></span><em>Undo</em>
            </button>
            <button class="bb-tool bb-tool--danger" type="button" data-act="delete"
                    aria-label="Remove the picked things (Delete)" title="Remove (Del)">
              <span data-icon="trash"></span><em>Remove</em>
            </button>
          </div>

          <!-- ── the dock: three families, built from js/tools.js ─────── -->
          <div class="bb-dock">
            <div class="bb-dock__tabs" id="bb-dock-tabs" role="tablist" aria-label="What to add"></div>
            <div class="bb-dock__body">
              <div class="bb-dock__panel" id="bb-dock-panel"></div>
              <div class="bb-dock__group bb-dock__group--tags" role="group" aria-label="Highlight">
                <span class="bb-dock__label">Highlight</span>
                <span class="bb-tagdots" id="bb-tagdots"></span>
                <button class="bb-tagclear" type="button" data-tag="none" title="Clear highlight">
                  <span data-icon="eraser"></span>
                </button>
              </div>
            </div>
          </div>

          <!-- ── base popover ─────────────────────────────────────────── -->
          <div class="bb-pop" id="bb-pop-base" role="dialog" aria-label="Working base" hidden>
            <div class="bb-pop__head">
              <span class="bb-eyebrow">Working base</span>
              <button class="bb-pop__x" type="button" data-close><span data-icon="close"></span></button>
            </div>
            <div class="bb-bases" id="bb-bases"></div>
            <p class="bb-pop__note" id="bb-base-note"></p>
            <label class="bb-switch">
              <input type="checkbox" id="bb-strict" checked />
              <span>
                <b>Trade rules</b> — only exactly <em id="bb-strict-n">10</em> alike blocks
                may be merged. Turn this off to join any blocks that match.
              </span>
            </label>
          </div>

          <!-- ── own-size popover ─────────────────────────────────────── -->
          <div class="bb-pop bb-pop--own" id="bb-pop-own" role="dialog" aria-label="Build your own block" hidden>
            <div class="bb-pop__head">
              <span class="bb-eyebrow">Build your own block</span>
              <button class="bb-pop__x" type="button" data-close><span data-icon="close"></span></button>
            </div>
            <div class="bb-dims">
              <label class="bb-dim">
                <span>Length</span>
                <span class="bb-step">
                  <button type="button" data-step="-1" data-dim="l" aria-label="Shorter">–</button>
                  <input type="number" id="bb-dim-l" min="1" max="20" value="3" inputmode="numeric" />
                  <button type="button" data-step="1" data-dim="l" aria-label="Longer">+</button>
                </span>
              </label>
              <label class="bb-dim">
                <span>Width</span>
                <span class="bb-step">
                  <button type="button" data-step="-1" data-dim="w" aria-label="Narrower">–</button>
                  <input type="number" id="bb-dim-w" min="1" max="20" value="2" inputmode="numeric" />
                  <button type="button" data-step="1" data-dim="w" aria-label="Wider">+</button>
                </span>
              </label>
              <label class="bb-dim">
                <span>Height</span>
                <span class="bb-step">
                  <button type="button" data-step="-1" data-dim="h" aria-label="Lower">–</button>
                  <input type="number" id="bb-dim-h" min="1" max="20" value="2" inputmode="numeric" />
                  <button type="button" data-step="1" data-dim="h" aria-label="Taller">+</button>
                </span>
              </label>
            </div>
            <p class="bb-dims__out" id="bb-dims-out"></p>
            <button class="pp-btn" type="button" id="bb-add-own">
              Put it on the canvas <span data-icon="plus"></span>
            </button>
          </div>

          <!-- ── place-value board ────────────────────────────────────── -->
          <aside class="bb-board" id="bb-board" aria-label="Place-value board" hidden>
            <div class="bb-board__head">
              <span class="bb-eyebrow">The canvas, read as a number</span>
              <button class="bb-pop__x" type="button" data-close-board>
                <span data-icon="close"></span>
              </button>
            </div>
            <div id="bb-board-body"></div>
          </aside>

          <p class="bb-toast" id="bb-toast" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <script type="module">
      import { heroPaint } from "/utils/components/nav-icons.js";
      document.querySelectorAll(".bb-paint").forEach((el) => (el.innerHTML = heroPaint()));
    </script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
