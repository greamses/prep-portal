<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo/logo-light.svg" />
    <meta name="theme-color" content="#f4c95d" />
    <title>Prep Portal | Algebra Moves</title>
    <meta
      name="description"
      content="An endless sheet for working algebra out. Type an equation on the keypad, tap a term, and name what you want done with it — take it from both sides, add it to a like term, multiply, divide, cancel — and watch the writing travel into the line below."
    />

    <!-- Page access gate: feature "prep-math-activities", part "algebra-moves" -->
    <script type="module" src="/utils/auth/premium-guard.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;600;700&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
        }
      }
    </script>

    <script src="/utils/components/loader.js"></script>
  </head>

  <body class="am-body">
    <div id="loader">
      <div id="loader-wrapper"><div class="logo-cluster"></div></div>
      <div class="loader-word"><span>Algebra</span></div>
      <div class="loader-bar"></div>
    </div>

    <script type="module" src="/utils/auth/login-guard.js"></script>
    <nav class="site-nav" data-nav="main"></nav>

    <!-- ═══ THE CANVAS, FILLING WHAT IS LEFT OF THE WINDOW ═══ -->
    <main class="am-frame" id="am-frame">
      <div class="am-paint" aria-hidden="true"></div>

      <div class="am-canvas" id="am-canvas" touch-action="none"></div>

      <!-- ── What the tool is saying ─────────────────────────────────── -->
      <p class="am-say" id="am-say" role="status" aria-live="polite"></p>

      <!-- ── The rail ────────────────────────────────────────────────── -->
      <div class="am-rail" role="toolbar" aria-label="Canvas tools">
        <div class="am-rail__group">
          <button class="am-tool am-tool--key" type="button" id="am-add"
                  aria-expanded="false" aria-controls="am-drawer"
                  title="Type an equation" aria-label="Type an equation">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <em>New</em>
          </button>
          <button class="am-tool" type="button" id="am-work"
                  title="How many steps are left?" aria-label="How many steps are left?">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
            <em>Steps left</em>
          </button>
        </div>

        <div class="am-rail__group">
          <button class="am-tool" type="button" id="am-zoom-out" title="Zoom out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4.3-4.3"/></svg>
          </button>
          <button class="am-tool" type="button" id="am-zoom-in" title="Zoom in" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4.3-4.3"/></svg>
          </button>
          <button class="am-tool" type="button" id="am-zoom-reset" title="Back to the middle" aria-label="Back to the middle">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
          </button>
          <button class="am-tool" type="button" id="am-full" aria-pressed="false"
                  title="Fill the screen" aria-label="Fill the screen">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
          </button>
        </div>

        <span class="am-count" id="am-count"></span>
      </div>

      <!-- ── The keypad, in a drawer ─────────────────────────────────── -->
      <section class="am-drawer" id="am-drawer" aria-label="Type an equation" inert>
        <div class="am-drawer__paper">
          <button class="am-drawer__close" type="button" id="am-drawer-close" aria-label="Put the keypad away">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>

          <div class="am-keypad" id="am-keypad"></div>

          <div class="am-starters" id="am-starters"></div>
          <p class="am-note">
            Typed the way it is said — <b>1/2</b> for a half, <b>x^2</b> for a
            square, <b>3x</b> for three of them. The same algebra is reachable
            over HTTP: <a class="am-link" href="./api.html">see the engine</a>.
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="/utils/components/nav-builder.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
