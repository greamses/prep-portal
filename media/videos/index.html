<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PrepBot Videos: Maths Lessons, Step by Step | Prep Portal</title>
    <meta name="description" content="Every PrepBot TV lesson in one place: ratio, percentages, averages, sequences and series, fractions and more, each drawn and explained step by step, with competition questions worked two ways." />
    <link rel="canonical" href="https://www.prepportal.com.ng/media/videos/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@500;700;800&family=Shantell+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/utils/components/theme.css" />
    <!-- the blogs page's own sheet: the same receipt cards, filter bar and dropdowns -->
    <link rel="stylesheet" href="/blogs/css/render.css" />
    <link rel="stylesheet" href="/blogs/css/blog.css" />
    <link rel="stylesheet" href="/utils/components/nav.css" />
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
        }
      }
    </script>
    <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
    <style>
      /* MEDIA: PREPBOT VIDEOS. Built exactly like the blogs page (blogs/index.html): a receipt filter
         bar (search + dropdowns, never tag pills) over a grid of .science-card receipts. The only
         addition is the film's thumbnail at the top of the card, kept at the video's 16:9. */
      .mv-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .science-card .card-featured-img { height: auto; aspect-ratio: 16 / 9; }
      .mv-empty { grid-column: 1 / -1; text-align: center; padding: 2rem 1rem; font-family: var(--font-mono); color: var(--text-secondary); }
    </style>
  </head>

  <body>
    <nav class="site-nav" data-nav="main"></nav>
    <h1 class="mv-sr">PrepBot Videos</h1>

    <div class="science-container">
      <div class="filter-bar pp-receipt">
        <div class="filter-paper pp-receipt__paper">
          <div class="filter-search-row">
            <div class="search-wrapper">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="search-icon"><rect x="14.28" y="16.40" width="7.64" height="3.4" rx="1.7" fill="var(--accent-primary)" transform="rotate(45.00 18.10 18.10)"/><circle cx="10.4" cy="10.4" r="7.6" fill="var(--accent-secondary)"/><circle cx="10.4" cy="10.4" r="4.6" fill="#fff"/></svg>
              <input type="text" class="search-input" id="searchInput" placeholder="Search videos..." aria-label="Search videos" />
            </div>
          </div>
          <div class="filter-dropdowns-row">
            <select id="topicSel" aria-label="Topic"></select>
            <select id="typeSel" aria-label="Type of video"></select>
          </div>
        </div>
      </div>

      <div id="grid" class="science-grid"></div>
    </div>

    <script src="/utils/components/nav-builder.js" type="module"></script>
    <script type="module">
      import { FILMS, playLesson } from "/utils/components/workbook/tv-lessons.js";
      import { enhanceSelect } from "/utils/components/pp-select.js";

      /* the topics, in the order a learner meets them; a film without a topic is filed by where it lives */
      const TOPICS = [
        ["ratio", "Ratio"], ["percent", "Percentages"], ["averages", "Averages"], ["patterns", "Sequences"],
        ["algebra", "Algebra"], ["workbook", "Workbook lessons"], ["english", "English"],
      ];
      const topicOf = (f) => f.topic || (/^Comprehension/.test(f.of || "") ? "english" : /algebra|quadratic/i.test(f.of || "") ? "algebra" : "workbook");
      const typeOf = (f) => (f.lesson ? "Lessons" : (f.group || (f.topic ? "Worked questions" : "Lessons")));
      const ARROW = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:13px;height:13px;flex-shrink:0"><g transform="rotate(90 12 12)"><rect x="10.6" y="9" width="2.8" height="12" rx="1.4" fill="var(--accent-secondary)"/><path d="M12 2.6 19.4 11H4.6z" fill="var(--accent-danger)"/></g></svg>`;
      const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

      const tIndex = Object.fromEntries(TOPICS.map(([t], i) => [t, i]));
      const films = FILMS.map((f, i) => ({ ...f, t: topicOf(f), type: typeOf(f), i }))
        /* topic by topic; inside a topic the lessons first, then the questions, as the TV lists them */
        .sort((a, b) => (tIndex[a.t] - tIndex[b.t]) || ((b.type === "Lessons") - (a.type === "Lessons")) || (a.i - b.i));
      const present = TOPICS.filter(([t]) => films.some((f) => f.t === t));
      const nameOf = Object.fromEntries(TOPICS);

      const card = (f, n) => `<a class="science-card pp-receipt science-card--p${n % 6}" href="/media/videos/?v=${encodeURIComponent(f.id)}" data-play="${esc(f.id)}">`
        + `<div class="card-inner pp-receipt__paper">`
        + (f.topic ? `<img class="card-featured-img" src="/tools/film-thumbnail/png/${esc(f.id)}.png" alt="" loading="lazy">` : "")
        + `<div class="card-badges"><span class="pp-sticky pp-sticky--c${tIndex[f.t] % 6}">${esc(nameOf[f.t])}</span></div>`
        + `<h2 class="card-title">${esc(f.name)}</h2>`
        + `<p class="card-excerpt">${esc(f.type === "Lessons" ? (f.of || "Lesson") : f.type)}</p>`
        + `<div class="read-more">Watch ${ARROW}</div>`
        + `</div></a>`;

      const q = new URLSearchParams(location.search);
      const topicSel = document.getElementById("topicSel"), typeSel = document.getElementById("typeSel"), search = document.getElementById("searchInput");
      topicSel.innerHTML = [["", "All topics"], ...present].map(([t, n]) => `<option value="${t}">${esc(n)}</option>`).join("");
      if (present.some(([t]) => t === q.get("t"))) topicSel.value = q.get("t");

      /* the types follow the topic: ratio has Ages, Shapes...; averages has its own */
      function fillTypes() {
        const keep = typeSel.value;
        const types = [...new Set(films.filter((f) => !topicSel.value || f.t === topicSel.value).map((f) => f.type))];
        typeSel.innerHTML = [["", "All videos"], ...types.map((t) => [t, t])].map(([v, n]) => `<option value="${esc(v)}">${esc(n)}</option>`).join("");
        typeSel.value = types.includes(keep) ? keep : "";
      }

      function render() {
        const words = search.value.trim().toLowerCase();
        const list = films.filter((f) => (!topicSel.value || f.t === topicSel.value) && (!typeSel.value || f.type === typeSel.value)
          && (!words || `${f.name} ${f.of || ""} ${f.type} ${nameOf[f.t]}`.toLowerCase().includes(words)));
        document.getElementById("grid").innerHTML = list.length ? list.map(card).join("") : `<p class="mv-empty">No videos match that yet.</p>`;
        const u = new URL(location.href);
        if (topicSel.value) u.searchParams.set("t", topicSel.value); else u.searchParams.delete("t");
        history.replaceState(null, "", u);
      }

      fillTypes();
      enhanceSelect(topicSel, { className: "pp-select--filter" });
      enhanceSelect(typeSel, { className: "pp-select--filter" });
      topicSel.addEventListener("change", () => { fillTypes(); render(); });
      typeSel.addEventListener("change", render);
      search.addEventListener("input", render);

      const play = (id) => { const f = FILMS.find((x) => x.id === id); if (f) playLesson(id, f.name); };
      document.getElementById("grid").addEventListener("click", (e) => {
        const c = e.target.closest("[data-play]");
        if (!c || e.ctrlKey || e.metaKey || e.shiftKey) return;   // a new tab opens the shareable link
        e.preventDefault();
        play(c.dataset.play);
      });
      render();
      if (q.get("v")) play(q.get("v"));   // /media/videos/?v=<film> opens straight on that film
    </script>
  </body>
</html>
