<!doctype html>
<html lang="en" data-plain-buttons>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cross Math — A Crossword of Sums | PrepPortal</title>
    <meta
      name="description"
      content="A crossword made of sums: every row and column is an equation, and the missing numbers are on the tiles below. Place them all so every line is true."
    />

    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo/logo-light.svg" />
    <meta name="theme-color" content="#f4c95d" />

    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;600;700&family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/utils/components/theme.css" />
    <link rel="stylesheet" href="/utils/components/nav.css" />
    <link rel="stylesheet" href="/utils/components/components.css" />
    <link rel="stylesheet" href="/utils/components/setup.css" />
    <link rel="stylesheet" href="/utils/components/game-overlays.css" />
    <link rel="stylesheet" href="/home/games/css/paper-game.css" />
    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
        }
      }
    </script>

    <script src="/utils/components/loader.js"></script>
    <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
  </head>

  <body>
    <div id="loader">
      <div id="loader-wrapper">
        <div class="logo-cluster"></div>
      </div>
      <div class="loader-word"><span>CROSS MATH</span></div>
      <div class="loader-bar"></div>
    </div>

    <nav class="site-nav" data-nav="main"></nav>

    <div class="builder-paint" aria-hidden="true"></div>

    <!-- ═══ SETUP ═══ -->
    <main class="pp-setup" id="cross-setup">
      <div class="pgame-hdr">
        <div class="pgame-eyebrow">Mathematics</div>
        <h1>Cross Math</h1>
        <p class="pgame-sub">A crossword of sums. Put the number tiles in the boxes so every row and column is true.</p>
      </div>

      <div class="pp-setup__receipt pp-receipt">
        <div class="pp-setup__paper pp-receipt__paper">
          <p class="pp-setup__title">Puzzle Settings</p>

          <div class="pp-setup-field">
            <span>The Boxes</span>
            <div class="strip-group" data-label="An empty box shows" data-setting="inputStyle">
              <label class="pp-sticky pp-sticky--tape sticky-choice pp-sticky--c0"><input type="radio" name="cross-input" value="?" checked /><span>A question mark</span></label>
              <label class="pp-sticky pp-sticky--tape sticky-choice pp-sticky--c1"><input type="radio" name="cross-input" value="letter" /><span>Letters</span></label>
              <label class="pp-sticky pp-sticky--tape sticky-choice pp-sticky--c2"><input type="radio" name="cross-input" value="shape" /><span>Shapes</span></label>
              <label class="pp-sticky pp-sticky--tape sticky-choice pp-sticky--c3"><input type="radio" name="cross-input" value="empty" /><span>Nothing</span></label>
            </div>
          </div>

          <button class="pgame-start-btn pp-sticky pp-sticky--tape pp-note-btn pp-sticky--c0" type="button" onclick="startGame()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="16" height="16"><path d="M6.6 3.8 20.4 12 6.6 20.2z" fill="var(--accent-success)"/></svg>
            <span>Start Game</span>
          </button>
        </div>
      </div>
    </main>

    <!-- ═══ PLAY OVERLAY ═══ -->
    <div class="review-bd" id="game-modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="review-wrap">
        <div class="pgame-head">
          <span class="pp-sticky pp-sticky--tape pgame-note" id="timer">00:00</span>
          <span class="pp-sticky pp-sticky--tape pgame-note"><span id="stat-wins">0</span> solved</span>
        </div>

        <div class="pp-receipt">
          <div class="pp-receipt__paper pgame-paper">
            <!-- 9x9 grid -->
            <div class="game-container" id="grid"></div>
          </div>
        </div>

        <p class="pgame-feedback" id="game-feedback"></p>

        <!-- The number tiles -->
        <div class="tiles-container" id="tiles"></div>

        <div class="pp-lobby-actions">
          <button class="pgame-btn pp-sticky pp-sticky--tape pp-note-btn pp-sticky--c1" id="undoBtn" type="button">Undo</button>
          <button class="pgame-btn pp-sticky pp-sticky--tape pp-note-btn pp-sticky--c2" id="hintBtn" type="button">Hint</button>
          <button class="pgame-btn pp-sticky pp-sticky--tape pp-note-btn pp-sticky--c3" type="button" onclick="generateNewGame()">New Puzzle</button>
          <button class="pgame-btn pp-sticky pp-sticky--tape pp-note-btn pp-note-btn--plain" type="button" onclick="closeGameModal()">Exit</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="/utils/components/nav-builder.js" type="module"></script>

    <script type="module">
      import { heroPaint } from "/utils/components/nav-icons.js";
      document.querySelectorAll(".builder-paint").forEach((el) => (el.innerHTML = heroPaint()));
    </script>
  </body>
</html>
