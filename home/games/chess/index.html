<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="msapplication-navbutton-color" content="#0b0d10" />
    <title>Grand Chess — Realistic 3D Chess</title>
    <meta
      name="description"
      content="A realistic 3D chess game built with Three.js. Hand-modelled wooden pieces, full legal moves, check, castling, en passant and promotion."
    />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <link rel="canonical" href="/" />
    <meta property="og:title" content="Grand Chess — Realistic 3D Chess" />
    <meta
      property="og:description"
      content="Realistic 3D chess with hand-modelled wooden pieces and full rules. Built with Three.js."
    />
    <meta property="og:type" content="website" />

    <!-- Site design system — provides CSS vars + fonts -->
    <link rel="stylesheet" href="../../../utils/components/theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/utils/auth/premium-guard.js"></script>
  </head>

  <body>
    <!-- Loading screen — hidden after the first rendered frame -->
    <div id="loader">
      <div class="loader-inner">
        <div class="loader-king" aria-hidden="true">
          <svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lk" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f6ead2" />
                <stop offset="100%" stop-color="#caa97a" />
              </linearGradient>
            </defs>
            <g fill="url(#lk)" stroke="#3a2c1a" stroke-width="2" stroke-linejoin="round">
              <path d="M28 6h8v6h6v8h-6v6h-8v-6h-6v-8h6z" />
              <path d="M20 34c0 8 4 12 12 12s12-4 12-12z" />
              <path d="M22 46h20l-3 28H25z" />
              <path d="M16 74h32v8H16z" />
            </g>
          </svg>
        </div>
        <h1 class="loader-title">GRAND CHESS</h1>
        <p class="loader-sub">REALISTIC 3D</p>
        <div class="loader-bar-bg">
          <div id="loader-bar" class="loader-bar-fill"></div>
        </div>
        <p id="loader-status" class="loader-status">CARVING THE PIECES…</p>
      </div>
    </div>

    <div id="app">
      <canvas id="scene"></canvas>

      <header class="hud-top">
        <div class="turn-card" id="turn-card">
          <span class="turn-dot" id="turn-dot"></span>
          <span class="turn-text" id="turn-text">White to move</span>
        </div>
        <div class="status-pill" id="status-pill" hidden></div>
      </header>

      <aside class="captured captured--top" aria-label="Captured white pieces">
        <span class="captured-label">Captured</span>
        <div class="captured-row" id="captured-white"></div>
      </aside>
      <aside class="captured captured--bottom" aria-label="Captured black pieces">
        <span class="captured-label">Captured</span>
        <div class="captured-row" id="captured-black"></div>
      </aside>

      <div class="controls-bar">
        <button class="ctrl-btn" id="btn-ai" title="Toggle computer opponent (cycles difficulty)">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3.4" y="8" width="17.2" height="12" rx="3" fill="var(--accent-secondary)"/><circle cx="9" cy="13.4" r="1.8" fill="#fff"/><circle cx="15" cy="13.4" r="1.8" fill="#fff"/><rect x="9" y="16.6" width="6" height="1.6" rx="0.8" fill="#fff"/><rect x="10.9" y="3.4" width="2.2" height="5.2" rx="1.1" fill="var(--text-tertiary)"/><circle cx="12" cy="3" r="1.8" fill="var(--accent-danger)"/></svg>
          <span id="ai-label">2 Players</span>
        </button>
        <button class="ctrl-btn" id="btn-fullscreen" title="Toggle fullscreen">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" id="fs-icon-open"><path d="M3 9.4V4.6A1.6 1.6 0 0 1 4.6 3h4.8v2.8H5.8v3.6zM21 9.4V4.6A1.6 1.6 0 0 0 19.4 3h-4.8v2.8h3.6v3.6zM3 14.6v4.8A1.6 1.6 0 0 0 4.6 21h4.8v-2.8H5.8v-3.6zM21 14.6v4.8a1.6 1.6 0 0 1-1.6 1.6h-4.8v-2.8h3.6v-3.6z" fill="var(--accent-secondary)"/></svg>
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" id="fs-icon-close"><path d="M9.4 3v4.8A1.6 1.6 0 0 1 7.8 9.4H3V6.6h3.6V3zM14.6 3v4.8a1.6 1.6 0 0 0 1.6 1.6H21V6.6h-3.6V3zM9.4 21v-4.8a1.6 1.6 0 0 0-1.6-1.6H3v2.8h3.6V21zM14.6 21v-4.8a1.6 1.6 0 0 1 1.6-1.6H21v2.8h-3.6V21z" fill="var(--accent-danger)"/></svg>
          <span id="fs-label">Fullscreen</span>
        </button>
        <button class="ctrl-btn" id="btn-undo" title="Undo last move">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7.6 8.6h6a5.9 5.9 0 0 1 0 11.8H9.4" fill="none" stroke="var(--accent-secondary)" stroke-width="3.2" stroke-linecap="round"/><path d="M3 8.6 9.4 4.4v8.4z" fill="var(--accent-danger)"/></svg>
          <span>Undo</span>
        </button>
        <button class="ctrl-btn" id="btn-flip" title="Flip camera to other side">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4.6 10A7.8 7.8 0 0 1 18 6.4" fill="none" stroke="var(--accent-secondary)" stroke-width="3" stroke-linecap="round"/><path d="M21.2 3.2 20.6 10l-6.4-2.4z" fill="var(--accent-danger)"/><path d="M19.4 14A7.8 7.8 0 0 1 6 17.6" fill="none" stroke="var(--accent-primary)" stroke-width="3" stroke-linecap="round"/><path d="M2.8 20.8 3.4 14l6.4 2.4z" fill="var(--accent-danger)"/></svg>
          <span>Flip</span>
        </button>
        <button class="ctrl-btn ctrl-btn--danger" id="btn-new" title="Start a new game">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19.6 12a7.6 7.6 0 1 1-2.3-5.4" fill="none" stroke="var(--accent-secondary)" stroke-width="3.2" stroke-linecap="round"/><path d="M13.6 7.2l6.4-3.4.4 6.8z" fill="var(--accent-danger)"/></svg>
          <span>New</span>
        </button>
      </div>

      <div class="hint" id="hint">
        Tap a piece to select · tap a highlighted square to move · drag to orbit
      </div>
    </div>

    <!-- Promotion picker -->
    <div class="promo" id="promo" hidden>
      <div class="promo-card">
        <h2>Promote pawn</h2>
        <div class="promo-options" id="promo-options"></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
