<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <link rel="icon" type="image/svg+xml" href="/logo/logo-light.svg" />
    <title>Prep Portal 2026 | 3D Maze</title>
    <meta name="theme-color" content="#7cc47c" />
    <meta
      name="description"
      content="Find your way out of a randomly generated 3D maze. Walk in first person with WASD and the mouse, and reach the glowing exit."
    />

    <!-- Shared theme + nav -->
    <link rel="stylesheet" href="/home/css/main.css" />
    <link rel="stylesheet" href="/utils/components/nav.css" />

    <!-- Techy monospace for the maze UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Oswald:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/home/games/maze/css/game.css" />

    <!-- Firebase import map (the shared nav imports /firebase-init.js) -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js"
        }
      }
    </script>
    <script type="module" src="/utils/auth/premium-guard.js"></script>
    <!-- Babylon.js is fetched with download progress by js/main.js so the load
         screen can show a real percentage. -->
  <link rel="stylesheet" href="/utils/components/sticky-ui.css" />
  </head>

  <body>
    <nav class="site-nav" data-nav="main"></nav>

    <main class="maze-page">
      <div class="maze-stage">
        <canvas
          id="maze-canvas"
          class="maze-canvas"
          touch-action="none"
        ></canvas>

        <div class="maze-hud">
          <span class="maze-title">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="20" height="20"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="2" fill="var(--accent-secondary)"/><rect x="5.4" y="5.4" width="13.2" height="2" rx="1" fill="#fff"/><rect x="5.4" y="5.4" width="2" height="9" rx="1" fill="#fff"/><rect x="9.6" y="9.6" width="9" height="2" rx="1" fill="#fff"/><rect x="9.6" y="9.6" width="2" height="9" rx="1" fill="#fff"/><rect x="13.8" y="13.8" width="4.8" height="2" rx="1" fill="#fff"/><circle cx="16.4" cy="17.4" r="1.5" fill="var(--accent-danger)"/></svg>
            3D Maze
          </span>
          <div class="maze-hud-actions">
            <button type="button" id="maze-new" class="maze-btn">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19.6 12a7.6 7.6 0 1 1-2.3-5.4" fill="none" stroke="var(--accent-secondary)" stroke-width="3.2" stroke-linecap="round"/><path d="M13.6 7.2l6.4-3.4.4 6.8z" fill="var(--accent-danger)"/></svg>
              New maze
            </button>
            <button
              type="button"
              id="maze-settings-btn"
              class="maze-btn maze-btn--icon"
              title="Settings"
              aria-label="Settings"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="10.6" y="1.6" width="2.8" height="4.4" rx="1.2" fill="var(--accent-secondary)" transform="rotate(0 12 12)"/><rect x="10.6" y="1.6" width="2.8" height="4.4" rx="1.2" fill="var(--accent-secondary)" transform="rotate(45 12 12)"/><rect x="10.6" y="1.6" width="2.8" height="4.4" rx="1.2" fill="var(--accent-secondary)" transform="rotate(90 12 12)"/><rect x="10.6" y="1.6" width="2.8" height="4.4" rx="1.2" fill="var(--accent-secondary)" transform="rotate(135 12 12)"/><rect x="10.6" y="1.6" width="2.8" height="4.4" rx="1.2" fill="var(--accent-secondary)" transform="rotate(180 12 12)"/><rect x="10.6" y="1.6" width="2.8" height="4.4" rx="1.2" fill="var(--accent-secondary)" transform="rotate(225 12 12)"/><rect x="10.6" y="1.6" width="2.8" height="4.4" rx="1.2" fill="var(--accent-secondary)" transform="rotate(270 12 12)"/><rect x="10.6" y="1.6" width="2.8" height="4.4" rx="1.2" fill="var(--accent-secondary)" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="6.6" fill="var(--accent-secondary)"/><circle cx="12" cy="12" r="3.4" fill="#fff"/><circle cx="12" cy="12" r="1.7" fill="var(--accent-danger)"/></svg>
            </button>
            <button
              type="button"
              id="maze-fs"
              class="maze-btn maze-btn--icon"
              title="Fullscreen"
              aria-label="Toggle fullscreen"
            >
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="mz-fs-enter"><path d="M3 9.4V4.6A1.6 1.6 0 0 1 4.6 3h4.8v2.8H5.8v3.6zM21 9.4V4.6A1.6 1.6 0 0 0 19.4 3h-4.8v2.8h3.6v3.6zM3 14.6v4.8A1.6 1.6 0 0 0 4.6 21h4.8v-2.8H5.8v-3.6zM21 14.6v4.8a1.6 1.6 0 0 1-1.6 1.6h-4.8v-2.8h3.6v-3.6z" fill="var(--accent-secondary)"/></svg>
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="mz-fs-exit"><path d="M9.4 3v4.8A1.6 1.6 0 0 1 7.8 9.4H3V6.6h3.6V3zM14.6 3v4.8a1.6 1.6 0 0 0 1.6 1.6H21V6.6h-3.6V3zM9.4 21v-4.8a1.6 1.6 0 0 0-1.6-1.6H3v2.8h3.6V21zM14.6 21v-4.8a1.6 1.6 0 0 1 1.6-1.6H21v2.8h-3.6V21z" fill="var(--accent-danger)"/></svg>
            </button>
          </div>
        </div>

        <div class="maze-hint" id="maze-hint" hidden></div>

        <!-- grace-period countdown / "hunters active" flash -->
        <div class="maze-grace" id="maze-grace" hidden></div>

        <!-- Minimap (top-down view of the maze, player + exit) -->
        <canvas
          id="maze-map"
          class="maze-map"
          width="156"
          height="156"
          aria-label="Maze map"
        ></canvas>

        <!-- Analog movement stick (reuses the studio joystick design) -->
        <div class="mz-joy" id="mz-joy" aria-hidden="true">
          <div id="mz-joy-ring" class="mz-joy-ring">
            <span class="mz-joy-dish" aria-hidden="true"></span>
            <div id="mz-joy-knob" class="mz-joy-knob">
              <span class="mz-joy-knob-cap"></span>
            </div>
          </div>
        </div>

        <div class="mz-result mz-result--win" id="maze-win" hidden>
          <div class="mz-result-inner">
            <div class="mz-rule mz-rule--top"><i></i><i></i></div>
            <div class="mz-result-text">
              <h2>VICTORY</h2>
              <p>You reached the exit</p>
            </div>
            <div class="mz-rule mz-rule--bottom"><i></i><i></i></div>
            <button type="button" id="maze-again" class="maze-btn mz-result-btn">
              Play again
            </button>
          </div>
        </div>

        <!-- riddle gate (ancient wooden panel) -->
        <div class="maze-riddle" id="maze-riddle" hidden>
          <div class="mz-riddle-card">
            <div class="mz-riddle-tag" id="mz-riddle-tag">⚜ LOCKED GATE ⚜</div>
            <p class="mz-riddle-q" id="mz-riddle-q"></p>
            <div class="mz-riddle-row">
              <input type="text" id="mz-riddle-input" class="mz-riddle-input" placeholder="speak your answer…" autocomplete="off" autocapitalize="off" spellcheck="false" />
              <button type="button" class="mz-riddle-go" id="mz-riddle-go">OPEN</button>
            </div>
            <p class="mz-riddle-fb" id="mz-riddle-fb"></p>
          </div>
        </div>

        <div class="mz-result mz-result--lose" id="maze-lose" hidden>
          <div class="mz-result-inner">
            <div class="mz-rule mz-rule--top"><i></i><i></i></div>
            <div class="mz-result-text">
              <h2>DEFEAT</h2>
              <p>A hunter caught you</p>
            </div>
            <div class="mz-rule mz-rule--bottom"><i></i><i></i></div>
            <button type="button" id="maze-retry" class="maze-btn mz-result-btn">
              Try again
            </button>
          </div>
        </div>

        <!-- Settings panel -->
        <div class="maze-settings" id="maze-settings" hidden>
          <div class="mz-set-card">
            <div class="mz-set-head"><span>SETTINGS</span><button type="button" id="mz-set-close" aria-label="Close">&#10005;</button></div>
            <label class="mz-set-row">Maze size
              <select id="mz-set-size">
                <option value="S">Small</option>
                <option value="M">Medium</option>
                <option value="L">Large</option>
                <option value="XL">Huge</option>
              </select>
            </label>
            <label class="mz-set-row">Riddle gates
              <select id="mz-set-gates"><option>0</option><option>1</option><option>3</option><option>5</option></select>
            </label>
            <label class="mz-set-row">Zombies
              <select id="mz-set-zombies"><option>0</option><option>3</option><option>5</option><option>8</option><option>12</option></select>
            </label>
            <label class="mz-set-row">Camera
              <select id="mz-set-cam"><option value="Close">Close</option><option value="Normal">Normal</option><option value="Far">Far</option></select>
            </label>
            <label class="mz-set-row">Gate subject
              <select id="mz-set-subject">
                <option value="all">All</option>
                <option value="math">Math</option>
                <option value="english">English</option>
                <option value="science">Science</option>
              </select>
            </label>
            <label class="mz-set-row">Scene
              <select id="mz-set-scene">
                <option value="dungeon">Dungeon</option>
                <option value="grass">Grass</option>
                <option value="forest">Forest</option>
                <option value="ice">Ice</option>
              </select>
            </label>
            <button type="button" class="mz-set-apply" id="mz-set-apply">APPLY &amp; RESTART</button>
          </div>
        </div>

        <!-- Game load screen — terminal boot style -->
        <div class="maze-loader" id="maze-loader">
          <div class="maze-loader-card">
            <div class="mz-rule mz-rule--top"><i></i><i></i></div>
            <div class="mz-load-head">
              <span class="mz-load-tag">SYS</span>
              <span class="mz-load-title">MAZE RUNNER</span>
              <span class="mz-load-blink">_</span>
            </div>
            <div class="mz-rule mz-rule--bottom"><i></i><i></i></div>

            <div class="mz-bar" id="mz-bar" aria-hidden="true"></div>
            <div class="mz-load-status">
              <span id="maze-loader-pct">00%</span>
              <span class="mz-load-sep">//</span>
              <span id="maze-loader-status">booting…</span>
            </div>

            <div class="mz-log" id="mz-log" aria-hidden="true"></div>

            <div class="mz-controls">
              <div class="mz-controls-h">// CONTROLS</div>
              <ul>
                <li><b>WASD / STICK</b><span>move</span></li>
                <li><b>DRAG</b><span>turn the camera</span></li>
                <li><b>SHIFT</b><span>run</span></li>
                <li><b>FIND</b><span>the green exit</span></li>
                <li><b>AVOID</b><span>the red hunters</span></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/home/games/maze/js/main.js"></script>
    <script type="module" src="/utils/components/nav-builder.js"></script>
  </body>
</html>
