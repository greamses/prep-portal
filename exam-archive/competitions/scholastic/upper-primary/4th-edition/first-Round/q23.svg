<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <!-- A 5 by 5 grid of small squares; 9 are shaded in an X -->
  <g fill="#9a9a9a">
    <rect x="10" y="10" width="40" height="40" />
    <rect x="170" y="10" width="40" height="40" />
    <rect x="50" y="50" width="40" height="40" />
    <rect x="130" y="50" width="40" height="40" />
    <rect x="90" y="90" width="40" height="40" />
    <rect x="50" y="130" width="40" height="40" />
    <rect x="130" y="130" width="40" height="40" />
    <rect x="10" y="170" width="40" height="40" />
    <rect x="170" y="170" width="40" height="40" />
  </g>
  <g stroke="black" stroke-width="2.5" fill="none">
    <rect x="10" y="10" width="200" height="200" />
    <line x1="50" y1="10" x2="50" y2="210" /><line x1="90" y1="10" x2="90" y2="210" />
    <line x1="130" y1="10" x2="130" y2="210" /><line x1="170" y1="10" x2="170" y2="210" />
    <line x1="10" y1="50" x2="210" y2="50" /><line x1="10" y1="90" x2="210" y2="90" />
    <line x1="10" y1="130" x2="210" y2="130" /><line x1="10" y1="170" x2="210" y2="170" />
  </g>
</svg>
