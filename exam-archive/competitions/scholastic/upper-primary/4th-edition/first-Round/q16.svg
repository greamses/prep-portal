<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%">
  <!-- Three lines from one point; the angles between them are a°, b° and c° -->
  <line x1="105" y1="90" x2="35" y2="30" stroke="black" stroke-width="2.5" stroke-linecap="round" />
  <line x1="105" y1="90" x2="200" y2="75" stroke="black" stroke-width="2.5" stroke-linecap="round" />
  <line x1="105" y1="90" x2="105" y2="168" stroke="black" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="105" cy="90" r="16" fill="none" stroke="black" stroke-width="2" />
  <g font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="black">
    <text x="112" y="62">b°</text>
    <text x="64" y="110">a°</text>
    <text x="128" y="118">c°</text>
  </g>
</svg>
