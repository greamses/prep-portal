<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="100%" height="100%">
  <!-- Three angles on the straight line AB, meeting at O: 60°, 5x° and 3x° -->
  <line x1="20" y1="150" x2="380" y2="150" stroke="black" stroke-width="2.5" />
  <line x1="20" y1="143" x2="20" y2="157" stroke="black" stroke-width="2" />
  <line x1="380" y1="143" x2="380" y2="157" stroke="black" stroke-width="2" />
  <!-- ray at 60° from OA, and ray at 45° (x = 15) from OB -->
  <line x1="200" y1="150" x2="125" y2="20" stroke="black" stroke-width="2.5" stroke-linecap="round" />
  <line x1="200" y1="150" x2="320" y2="30" stroke="black" stroke-width="2.5" stroke-linecap="round" />
  <!-- angle arcs -->
  <path d="M155 150 A45 45 0 0 1 177.5 111" fill="none" stroke="black" stroke-width="1.8" />
  <path d="M182.5 119.7 A35 35 0 0 1 224.7 125.3" fill="none" stroke="black" stroke-width="1.8" />
  <path d="M260 150 A60 60 0 0 0 242.4 107.6" fill="none" stroke="black" stroke-width="1.8" />
  <g font-family="'Times New Roman', serif" font-size="17" fill="black">
    <text x="128" y="138">60°</text>
    <text x="186" y="104">5x°</text>
    <text x="262" y="134">3x°</text>
    <text x="14" y="176" font-weight="bold">A</text>
    <text x="193" y="176" font-weight="bold">O</text>
    <text x="373" y="176" font-weight="bold">B</text>
  </g>
</svg>
