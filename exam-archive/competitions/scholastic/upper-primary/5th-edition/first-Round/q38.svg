<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <!-- PQ and RS cross at T; S and Q are joined. TS = TQ (one tick each);
       the angle PTR is 88°; x° is the angle at S in triangle STQ. -->
  <line x1="55" y1="20" x2="215" y2="190" stroke="black" stroke-width="2.5" />
  <line x1="185" y1="20" x2="40" y2="190" stroke="black" stroke-width="2.5" />
  <line x1="40" y1="190" x2="215" y2="190" stroke="black" stroke-width="2.5" />
  <!-- equal-length ticks on TS and TQ -->
  <line x1="78" y1="139" x2="92" y2="151" stroke="black" stroke-width="2" />
  <line x1="168" y1="134" x2="181" y2="125" stroke="black" stroke-width="2" />
  <!-- angle marks -->
  <path d="M108.1 76.5 A22 22 0 0 1 137.5 75.8" fill="none" stroke="black" stroke-width="1.6" />
  <path d="M68 190 A28 28 0 0 0 58 168" fill="none" stroke="black" stroke-width="1.6" />
  <g font-family="'Times New Roman', serif" font-size="17" fill="black">
    <text x="109" y="64">88°</text>
    <text x="68" y="181" font-style="italic">x°</text>
    <text x="40" y="17" font-style="italic" font-weight="bold">P</text>
    <text x="190" y="17" font-style="italic" font-weight="bold">R</text>
    <text x="138" y="88" font-style="italic" font-weight="bold">T</text>
    <text x="22" y="200" font-style="italic" font-weight="bold">S</text>
    <text x="222" y="200" font-style="italic" font-weight="bold">Q</text>
  </g>
</svg>
