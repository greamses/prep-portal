<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Pie chart: A 30% (top right), B 40% (bottom), C 30% (top left).
       From 12 o'clock clockwise: A 0°–108°, B 108°–252°, C 252°–360°. -->
  <circle cx="120" cy="120" r="100" fill="white" stroke="black" stroke-width="2.5" />
  <line x1="120" y1="120" x2="120" y2="20" stroke="black" stroke-width="2" />
  <line x1="120" y1="120" x2="215.1" y2="150.9" stroke="black" stroke-width="2" />
  <line x1="120" y1="120" x2="24.9" y2="150.9" stroke="black" stroke-width="2" />
  <circle cx="120" cy="120" r="11" fill="none" stroke="black" stroke-width="1.5" />
  <g font-family="Arial, sans-serif" font-size="15" fill="black" text-anchor="middle">
    <text x="172" y="70" font-weight="bold">A</text>
    <text x="150" y="104">30%</text>
    <text x="68" y="70" font-weight="bold">C</text>
    <text x="90" y="104">30%</text>
    <text x="120" y="160">40%</text>
    <text x="120" y="185" font-weight="bold">B</text>
  </g>
</svg>
